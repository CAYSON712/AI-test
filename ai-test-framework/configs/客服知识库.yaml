# ⚠️ 占位样例（Demo）
# ==================
# 本文件是「客服知识库」的演示用占位配置，用于验证 E 类 RAG 执行器链路，
# 不代表任何真实系统。以下内容为虚构：
#   - RAG_API_URL / RAG_API_TOKEN 指向的环境变量未配置（当前跑内置 Mock 检索）
#   - 检索接口 / 生成接口 / 评分字段为通用模板结构
# 接入真实知识库时：复制本文件为 configs/<真实系统>.yaml，替换为真实
#   base_url_env / token_env / 检索接口，并在 .env 配置真实密钥。
#
# =====================================================================
# 系统配置：客服知识库（RAG / 知识库，需求类型 E）
# =====================================================================
# 用途：给 generic_rag_executor 提供检索/生成接口配置，使其不写死任何知识库。
# 接入新知识库：复制本文件为 configs/<知识库名>.yaml，填 连接 + 检索接口 + 生成接口。
# 需求类型 E 决定接入方式为「检索 + 生成」，见 registry.py。
# =====================================================================

# ---- 连接配置（从 .env 读）----
连接:
  需求类型: "E"
  base_url_env: "RAG_API_URL"      # .env 里存知识库 API 地址的变量名
  token_env: "RAG_API_TOKEN"       # .env 里存 token 的变量名
  auth_header: "Authorization: Bearer {{token}}"

# ---- 检索接口 ----
# 调这个接口做文档检索，返回相关文档列表
检索接口:
  工具: "search"
  参数: [query, top_k]
  必填: [query]
  top_k: 5

# ---- 生成接口（可选）----
# 有单独的生成接口则配置；没有则执行器用 LLM 基于检索文档生成回答
生成接口:
  工具: "generate"
  参数: [query, documents]

# ---- 评分配置 ----
评分:
  期望文档字段: "expect_docs"     # 数据集用例期望检索到的文档
  期望答案字段: "expect_answer"   # 数据集用例期望答案要点
