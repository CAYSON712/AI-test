mcp_tools:
- name: set_allow_add_items_to_active_order
  description: 允許增加商品到進行中訂單、關閉加點。Enable or disable adding items to active/in-progress orders. Set confirm=false (default) for a preview; set confirm=true to execute.
  params:
  - merchId
  - enabled
  - confirm
  required:
  - merchId
  - enabled
- name: update_delivery_time_slot
  description: '更新配送時間、增加12:00時段、配送時間為11:00-21:00、更改開放時間、準備時間改為15分鐘、預計備餐時長、配送時間改為20分鐘、預計送達時長。Update a delivery time slot within a specific delivery area. Locate the slot by AreaId + Day (e.g., "Monday")
    + SlotIndex (0-based). Only provided fields are modified: open time, close time, preparation minutes, estimated delivery minutes, scheduled delivery time range. Set confirm=false (default) for a change
    preview; set confirm=true to execute. Requires explicit merchant confirmation.'
  params:
  - merchId
  - areaId
  - day
  - slotIndex
  - openTime
  - closeTime
  - preparationMinutes
  - estimatedDeliveryMinutes
  - scheduledDeliveryTimeRange
  - confirm
  required:
  - merchId
  - areaId
  - day
  - slotIndex
- name: spec_create
  description: 新建規格組、這個菜有大中小、新增一個規格。Create a new modifier/spec group (FoodParameterGroup). Provide Name (required), optional Options and LocalizedNames. Set confirm=false (default) for a preview; set confirm=true
    to execute.
  params:
  - merchId
  - specId
  - name
  - description
  - minimumSelection
  - maximumSelection
  - sort
  - options
  - localizedNames
  - confirm
  required:
  - merchId
  - name
- name: list_pickup_time_slots
  description: 查看自提時間列表、有哪些取餐時段。List all pickup time slots for a merchant, organized by day of week. Returns open/close times, preparation minutes, and scheduled pickup time range for each slot. Set confirm=false
    (default) for a preview; set confirm=true to execute.
  params:
  - merchId
  - confirm
  required:
  - merchId
- name: update_user_status
  description: 啟用/停用員工、將帳號設為無效。Enable or disable a store user account by updating IsActive status. Set confirm=false (default) for a preview; set confirm=true to execute.
  params:
  - merchId
  - merchManagerId
  - isActive
  - confirm
  required:
  - merchId
  - merchManagerId
  - isActive
- name: update_store_logo
  description: 上傳Logo、更換店鋪標誌。Update the store/shop logo image for a merchant. Supports Base64-encoded image strings or image URLs. Only the Logo field is modified; all other store configuration remains
    unchanged. Set confirm=false (default) for a change preview; set confirm=true to execute the change. Requires explicit merchant confirmation.
  params:
  - merchId
  - newLogo
  - confirm
  required:
  - merchId
  - newLogo
- name: get_store_info
  description: '查看店鋪資料、顯示基本信息。Returns basic store/shop information: name, logo URL, phone number, email, and address. This data is non-sensitive and can be freely queried. Set confirm=false (default) for
    a preview; set confirm=true to execute.'
  params:
  - merchId
  - confirm
  required:
  - merchId
- name: category_create
  description: 新建分類、新增一個分類。Create a new category for the merchant. Provide Name (required), optional Description, Sort, MenuIds, BannerUrl, and LocalizedNames. Client should generate a CategoryId GUID.
    Set confirm=false (default) for a preview; set confirm=true to execute. Requires explicit merchant confirmation.
  params:
  - merchId
  - categoryId
  - name
  - description
  - sort
  - menuIds
  - bannerUrl
  - localizedNames
  - confirm
  required:
  - merchId
  - name
- name: set_delivery_provider_type
  description: '自行安排配送、改用第三方配送。Set the delivery provider type: ''self'' for self-delivery or ''deli_connect'' for DeliConnect third-party. Set confirm=false (default) for a preview; set confirm=true to
    execute.'
  params:
  - merchId
  - providerType
  - confirm
  required:
  - merchId
  - providerType
- name: get_user_detail
  description: 查看用戶XXX的資料、員工資訊。Get detailed information for a specific store user/staff by ID, including roles, email, phone, name, and status. Set confirm=false (default) for a preview; set confirm=true
    to execute.
  params:
  - merchId
  - merchManagerId
  - confirm
  required:
  - merchId
  - merchManagerId
- name: set_auto_accept_orders
  description: 開啟自動接單、關閉自動接單。Enable or disable auto-accept orders for the store. When enabled, incoming orders are automatically accepted. Set confirm=false (default) for a preview; set confirm=true to
    execute.
  params:
  - merchId
  - enabled
  - confirm
  required:
  - merchId
  - enabled
- name: update_reward_campaign
  description: 更新優惠券/獎勵活動，支持積分換商品（ProductExchangeFoods：foodId + points）。Update a coupon campaign. Fetches from GET all then POST api/MerchCouponPromotion/update. For points-to-product exchange, provide
    ProductExchangeFoods with foodId and points. Set confirm=false (default) for preview; confirm=true to execute.
  params:
  - merchId
  - campaignId
  - name
  - startDate
  - endDate
  - discount
  - couponType
  - numberOfCoupon
  - published
  - minimumOrderAmount
  - maximumDiscount
  - productExchangeFoods
  - confirm
  required:
  - merchId
  - campaignId
- name: set_instant_pickup_only
  description: 僅支持即時自提、關閉預約自提。Enable or disable instant pickup only mode. When enabled (true), only instant pickup is supported (scheduled pickup is disabled). When disabled (false), both instant and scheduled
    pickup are supported. Only the IsAsapOnly field is modified. Set confirm=false (default) for a preview; set confirm=true to execute. Requires explicit merchant confirmation.
  params:
  - merchId
  - enabled
  - confirm
  required:
  - merchId
  - enabled
- name: update_social_account
  description: '關聯Instagram、綁定社交賬號。Link or update a social media account for the merchant. Supports: instagram, twitter, facebook, linkedin. If the platform already has a link, it will be updated; otherwise
    a new link is added. Other platforms'' existing links remain unchanged. Set confirm=false (default) for a change preview; set confirm=true to execute the change. Requires explicit merchant confirmation.'
  params:
  - merchId
  - platform
  - linkUrl
  - confirm
  required:
  - merchId
  - platform
  - linkUrl
- name: update_extra_fee
  description: 修改服務費、更改包裝費。Update an existing extra fee for a merchant. Only provided fields are modified. Set confirm=false (default) for a change preview; set confirm=true to execute. Requires explicit
    merchant confirmation.
  params:
  - merchId
  - feeId
  - name
  - target
  - feeType
  - value
  - isTaxable
  - description
  - confirm
  required:
  - merchId
  - feeId
- name: update_store_video
  description: 上傳視頻、添加店鋪視頻。Upload or update the store/shop display video (BannerVideoUrl) for a merchant. Supports Base64-encoded video strings or video URLs. Only the BannerVideoUrl field is modified;
    all other store configuration remains unchanged. Set confirm=false (default) for a change preview; set confirm=true to execute the change. Requires explicit merchant confirmation.
  params:
  - merchId
  - newVideo
  - confirm
  required:
  - merchId
  - newVideo
- name: item_list
  description: 查看所有商品、店裡有哪些商品。Query paginated item/food list for a merchant. Returns name, price, stock, sales status, and category IDs.
  params:
  - merchId
  - keyword
  - categoryId
  - menuId
  - salesStatus
  - pageIndex
  - pageSize
  required:
  - merchId
- name: menu_create
  description: 新建菜單、新增一個菜單。Create a new menu for the merchant. Provide Name (required), optional CategoryIds, OnlineTimes (days + time slots), and LocalizedNames. Client should generate a MenuId GUID. Set
    confirm=false (default) for a preview; set confirm=true to execute. Requires explicit merchant confirmation.
  params:
  - merchId
  - menuId
  - name
  - localizedNames
  - categoryIds
  - onlineTimes
  - isActive
  - sort
  - confirm
  required:
  - merchId
  - name
- name: add_store_user
  description: 新增員工、添加後台帳號。Add a new store user/staff account with a phone number and role assignment. Use list_merchant_roles to find available role IDs first. Set confirm=false (default) for a preview;
    set confirm=true to execute.
  params:
  - merchId
  - phone
  - roleId
  - confirm
  required:
  - merchId
  - phone
  - roleId
- name: set_auto_switch_ready_status
  description: 自動切換訂單狀態、關閉自動切換。Enable or disable automatic order status switching to ready. Set confirm=false (default) for a preview; set confirm=true to execute.
  params:
  - merchId
  - enabled
  - confirm
  required:
  - merchId
  - enabled
- name: menu_delete
  description: 刪除這個菜單。Delete a menu by ID. This operation is irreversible. Set confirm=false (default) for a preview; set confirm=true to execute. Requires explicit merchant confirmation.
  params:
  - menuId
  - confirm
  required:
  - menuId
- name: update_store_name
  description: 修改店名、店鋪名稱改為。Update the store/shop name for a merchant. Only the Name field is modified; all other store configuration remains unchanged. Set confirm=false (default) for a change preview;
    set confirm=true to execute the change. Requires explicit merchant confirmation.
  params:
  - merchId
  - newName
  - confirm
  required:
  - merchId
  - newName
- name: remove_report_subscription
  description: 移除報表郵件訂閱。Remove a business report email subscription by Id or Email. When using Email, set IsSalesReport and/or IsPayoutReport to avoid deleting the wrong subscription. Set confirm=false
    (default) for a preview; set confirm=true to execute. Requires explicit merchant confirmation.
  params:
  - id
  - email
  - isSalesReport
  - isPayoutReport
  - confirm
  required: []
- name: list_reward_campaigns
  description: 查看優惠券/獎勵活動列表。Query coupon/reward campaigns for a merchant via GET api/MerchCouponPromotion/all.
  params:
  - merchId
  - queryType
  - pageIndex
  - pageSize
  required:
  - merchId
- name: item_update_stock
  description: 修改商品庫存。庫存沒了、補貨。Update item stock quantity. Set confirm=false (default) for a preview; set confirm=true to execute.
  params:
  - itemId
  - stock
  - confirm
  required:
  - itemId
- name: get_third_party_integrations
  description: 查看第三方接入狀況、會員系統綁定了嗎。Query third-party integration status (e.g., EasyCrm membership system binding). Set confirm=false (default) for a preview; set confirm=true to execute.
  params:
  - merchId
  - confirm
  required:
  - merchId
- name: list_my_merchants
  description: '查看我擁有的所有商家店鋪。List all merchants associated with the current account, including merchant ID, name, address, logo, phone, email, timezone, and type. Important Note: Please call this tool first
    when you need a MerchId but do not have one.You can use this tool to discover available merchants before calling any tools that require a MerchId.Set confirm=false (default) for a preview; set confirm=true
    to execute.'
