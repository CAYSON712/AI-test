    delivery fee, minimum amounts, taxable flag, enabled state, and ASAP setting.
    Set confirm=false (default) for a change preview; set confirm=true to execute.
    Requires explicit merchant confirmation.'
  params:
  - merchId
  - areaId
  - name
  - areaType
  - latitude
  - longitude
  - deliveryRadiusMiles
  - minimumAmountForDelivery
  - minimumAmountToVoidDeliveryFee
  - deliveryFee
  - deliveryFeeTaxable
  - isEnabled
  - allowAsap
  - confirm
  required:
  - merchId
  - areaId
- name: get_bank_account_info
  description: '查看我的收款帳戶、銀行帳號末四碼。Returns desensitized bank account information: bank
    name, masked routing number, last 4 digits of account number, account name, and
    description. Full sensitive data (complete account/routing numbers) is never returned.
    Set confirm=false (default) for a preview; set confirm=true to execute.'
  params:
  - merchId
  - confirm
  required:
  - merchId
- name: add_pickup_time_slot
  description: 添加自提時間、新增取餐時段。Add a pickup time slot for specified days of the week.
