  - 建工具: spec_create
    删除工具: spec_delete
    删除主键: specId
    建参数:
      merchId: '{merchId}'
      name: _AUTOTEST_SPEC
    删除参数:
      merchId: '{merchId}'
      specId: '{新实体ID}'
  - 建工具: add_delivery_area
    删除工具: delete_delivery_area
    删除主键: areaId
    建参数:
      merchId: '{merchId}'
      name: _AUTOTEST_AREA
      areaType: circle
      latitude: 22.5175
      longitude: 113.3926
      deliveryRadiusMiles: 1
      allowAsap: true
      minimumAmountForDelivery: 0
      deliveryFee: 0
      deliveryFeeTaxable: false
    删除参数:
      merchId: '{merchId}'
      areaId: '{新实体ID}'
  能力缺口:
  - 工具: set_store_open_status
    原因: get_store_info 不返回营业状态字段（只有 name/phone/email/address）， 开/关店后无法验证也无法还原
  - 工具: set_auto_accept_orders
    原因: 无读取「自动接单」当前状态的接口，改后无法验证与还原
  - 工具: set_delivery_enabled
    原因: 无读取「配送开关」当前状态的接口，改后无法验证与还原
  - 工具: set_pickup_enabled
    原因: 无读取「自提开关」当前状态的接口，改后无法验证与还原
  - 工具: set_pickup_order_threshold
    原因: 无读取「自提订单门槛」当前值的接口，改后无法验证与还原
  - 工具: set_utensil_option_enabled
    原因: 无读取「餐具选项开关」当前状态的接口，改后无法验证与还原
  - 工具: set_sales_mode
    原因: 无读取「销售模式」当前值的接口，改后无法验证与还原
  - 工具: set_tip_options
    原因: 无读取「小费选项」当前值的接口，改后无法验证与还原
  - 工具: set_tip_type
    原因: 无读取「小费类型」当前值的接口，改后无法验证与还原
  - 工具: create_reward_campaign
    原因: 无删除优惠券活动的接口（无 delete_reward_campaign）， 创建后无法清理，会永久留下测试活动
  - 工具: set_order_phone_notification
    原因: 无读取该开关状态的接口
  - 工具: set_support_realtime_messaging
    原因: 无读取该开关状态的接口
  - 工具: set_tax_rate
    原因: tax_list 有缺陷（后台 6 条只返回 1 条），商户默认税率不可读
  - 工具: set_stripe_invoice_note
