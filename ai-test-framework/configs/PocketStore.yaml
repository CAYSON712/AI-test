  - 工具: create_reward_campaign
    快照工具: list_all_campaigns
    恢复工具: create_reward_campaign
    快照字段:
    - name
    主键参数: id
    主键字段: id
  - 工具: create_discount_campaign
    快照工具: list_all_campaigns
    恢复工具: create_discount_campaign
    快照字段:
    - name
    主键参数: merchId
