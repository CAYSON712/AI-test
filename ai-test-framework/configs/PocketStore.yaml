# =====================================================================
# 系统配置：PocketStore 商家经营后台（BossApp / test 环境）
# =====================================================================
# 真实 MCP：https://testmcp.aipocketstore.com/mcp（PocketStore MCP Server 1.0.0）
# 用途：给 generic_mcp_executor 提供「连接 + 工具 schema」。
#
# !! 2026-10-08 探针事实 !!
#   1. 服务端按 JWT 的 sourceSystem 动态下发工具：
#        匿名=119、BossApp=111（本系统）、CameraAi=8（摄像头只读）、WebMerchant=0（不可用）
#      token 获取：POST https://aimanager.testomenow.com/api/McpOperation/mcpClientSignIn
#        body {clientType:0, codeOrPassword:"91923qjc", phoneOrEmail:"9023162140", signInMethod:2}
#        取 mcpClientCredential.mcpServers.pocketstore.headers.Authorization
#   2. 「参数包装」= parameters（自动探测，勿手改）
#   3. confirm 二段式：几乎所有工具带 confirm（false=仅预览不执行，true=真正执行）
#   4. ID 类参数一律 string（uuid）；merchId 跨店可用（不锁定 token 自带店铺，已实测）
#   5. ⚠ 大量写工具必填参数【不含 merchId】（item_update 只要 itemId、batch_item_price
#      只要 price、category_delete 只要 categoryId）→ 高危写入面，测试用「自建自删」
#   6. 默认店铺：cayson店鋪4444（33 商品 / 4 分类 / 3 菜单 / 1 税率 / 0 员工）
# =====================================================================
连接:
  需求类型: C
  base_url_env: POCKETSTORE_MCP_URL
  token_env: POCKETSTORE_MCP_TOKEN
  merchant_id_env: POCKETSTORE_MCP_MERCHANT_ID
  参数包装: parameters
  干跑开关参数名: confirm   # CONFIRM_DRYRUN=1 时该参数强制 false（服务端只预览不执行）
连接演示工具: list_pickup_time_slots

# ---- 参数取值域：让生成器收敛枚举，非法值回退首个合法值（2026-10-08 按真实 schema 提取）----
# 注意：status 在 PocketStore 语义有分叉——
#   batch_item_status.status / 商品上下架: 字符串枚举 ['OnSale','OffSale']
#   item_update.status / item_create.status: 整数（1=上架 0=下架）
#   店铺营业状态: 'open'/'closed'
# 这里按【字符串枚举】收敛（覆盖内置 POS 的 Selling/Off，避免误判），
# 整数型 status 由生成器按 schema type=integer 处理。
param_enums:
  status: [OnSale, OffSale]
  # paymentType：PocketStore 取值与 POS 系（Cash/CreditCard）完全不同，
  #   不覆盖会沿用内置 POS 枚举误判（生成器已从描述提取 proton_pay 等）。
  paymentType: [proton_pay, offline_cash, offline_card, offline_other]
  priceAdjustmentType: [Regular, Percentage, FixedValue]
  discountType: [PercentagePrice, FixedPrice]
  couponType: [Cash, Percentage, ProductExchange]
  filterType: [All, Published, Unpublished, Deleted]
  queryType: [All, Published, UnActive, UnPublished]
param_bools:
  - confirm
  - enabled
  - isActive
  - isEnabled
  - isTaxable
  - isSalesReport
  - isPayoutReport
  - isDefaultForNewFood
  - allowAsap
  - deliveryFeeTaxable

mcp_tools:
- name: set_allow_add_items_to_active_order
  description: 允許增加商品到進行中訂單、關閉加點。Enable or disable adding items to active/in-progress
    orders. Set confirm=false (default) for a preview; set confirm=true to execute.
  params:
  - merchId
  - enabled
  - confirm
  required:
  - merchId
  - enabled
- name: update_delivery_time_slot
  description: '更新配送時間、增加12:00時段、配送時間為11:00-21:00、更改開放時間、準備時間改為15分鐘、預計備餐時長、配送時間改為20分鐘、預計送達時長。Update
    a delivery time slot within a specific delivery area. Locate the slot by AreaId
    + Day (e.g., "Monday") + SlotIndex (0-based). Only provided fields are modified:
    open time, close time, preparation minutes, estimated delivery minutes, scheduled
    delivery time range. Set confirm=false (default) for a change preview; set confirm=true
    to execute. Requires explicit merchant confirmation.'
  params:
  - merchId
  - areaId
  - day
  - slotIndex
  - openTime
  - closeTime
  - preparationMinutes
  - estimatedDeliveryMinutes
  - scheduledDeliveryTimeRange
  - confirm
  required:
  - merchId
  - areaId
  - day
  - slotIndex
- name: spec_create
  description: 新建規格組、這個菜有大中小、新增一個規格。Create a new modifier/spec group (FoodParameterGroup).
    Provide Name (required), optional Options and LocalizedNames. Set confirm=false
    (default) for a preview; set confirm=true to execute.
  params:
  - merchId
  - specId
  - name
  - description
  - minimumSelection
  - maximumSelection
  - sort
  - options
  - localizedNames
  - confirm
  required:
  - merchId
  - name
- name: list_pickup_time_slots
  description: 查看自提時間列表、有哪些取餐時段。List all pickup time slots for a merchant, organized
    by day of week. Returns open/close times, preparation minutes, and scheduled pickup
    time range for each slot. Set confirm=false (default) for a preview; set confirm=true
    to execute.
  params:
  - merchId
  - confirm
  required:
  - merchId
- name: update_user_status
  description: 啟用/停用員工、將帳號設為無效。Enable or disable a store user account by updating
    IsActive status. Set confirm=false (default) for a preview; set confirm=true to
    execute.
  params:
  - merchId
  - merchManagerId
  - isActive
  - confirm
  required:
  - merchId
  - merchManagerId
  - isActive
- name: update_store_logo
  description: 上傳Logo、更換店鋪標誌。Update the store/shop logo image for a merchant. Supports
    Base64-encoded image strings or image URLs. Only the Logo field is modified; all
    other store configuration remains unchanged. Set confirm=false (default) for a
    change preview; set confirm=true to execute the change. Requires explicit merchant
    confirmation.
  params:
  - merchId
  - newLogo
  - confirm
  required:
  - merchId
  - newLogo
- name: get_store_info
  description: '查看店鋪資料、顯示基本信息。Returns basic store/shop information: name, logo URL,
    phone number, email, and address. This data is non-sensitive and can be freely
    queried. Set confirm=false (default) for a preview; set confirm=true to execute.'
  params:
  - merchId
  - confirm
  required:
  - merchId
- name: category_create
  description: 新建分類、新增一個分類。Create a new category for the merchant. Provide Name (required),
    optional Description, Sort, MenuIds, BannerUrl, and LocalizedNames. Client should
    generate a CategoryId GUID. Set confirm=false (default) for a preview; set confirm=true
    to execute. Requires explicit merchant confirmation.
  params:
  - merchId
  - categoryId
  - name
  - description
  - sort
  - menuIds
  - bannerUrl
  - localizedNames
  - confirm
  required:
  - merchId
  - name
- name: set_delivery_provider_type
  description: '自行安排配送、改用第三方配送。Set the delivery provider type: ''self'' for self-delivery
    or ''deli_connect'' for DeliConnect third-party. Set confirm=false (default) for
    a preview; set confirm=true to execute.'
  params:
  - merchId
  - providerType
  - confirm
  required:
  - merchId
  - providerType
- name: get_user_detail
  description: 查看用戶XXX的資料、員工資訊。Get detailed information for a specific store user/staff
    by ID, including roles, email, phone, name, and status. Set confirm=false (default)
    for a preview; set confirm=true to execute.
  params:
  - merchId
  - merchManagerId
  - confirm
  required:
  - merchId
  - merchManagerId
- name: set_auto_accept_orders
  description: 開啟自動接單、關閉自動接單。Enable or disable auto-accept orders for the store. When
    enabled, incoming orders are automatically accepted. Set confirm=false (default)
    for a preview; set confirm=true to execute.
  params:
  - merchId
  - enabled
  - confirm
  required:
  - merchId
  - enabled
- name: update_reward_campaign
  description: 更新優惠券/獎勵活動，支持積分換商品（ProductExchangeFoods：foodId + points）。Update a coupon
    campaign. Fetches from GET all then POST api/MerchCouponPromotion/update. For
    points-to-product exchange, provide ProductExchangeFoods with foodId and points.
    Set confirm=false (default) for preview; confirm=true to execute.
  params:
  - merchId
  - campaignId
  - name
  - startDate
  - endDate
  - discount
  - couponType
  - numberOfCoupon
  - published
  - minimumOrderAmount
  - maximumDiscount
  - productExchangeFoods
  - confirm
  required:
  - merchId
  - campaignId
- name: set_instant_pickup_only
  description: 僅支持即時自提、關閉預約自提。Enable or disable instant pickup only mode. When enabled
    (true), only instant pickup is supported (scheduled pickup is disabled). When
    disabled (false), both instant and scheduled pickup are supported. Only the IsAsapOnly
    field is modified. Set confirm=false (default) for a preview; set confirm=true
    to execute. Requires explicit merchant confirmation.
  params:
  - merchId
  - enabled
  - confirm
  required:
  - merchId
  - enabled
- name: update_social_account
  description: '關聯Instagram、綁定社交賬號。Link or update a social media account for the merchant.
    Supports: instagram, twitter, facebook, linkedin. If the platform already has
    a link, it will be updated; otherwise a new link is added. Other platforms'' existing
    links remain unchanged. Set confirm=false (default) for a change preview; set
    confirm=true to execute the change. Requires explicit merchant confirmation.'
  params:
  - merchId
  - platform
  - linkUrl
  - confirm
  required:
  - merchId
  - platform
  - linkUrl
- name: update_extra_fee
  description: 修改服務費、更改包裝費。Update an existing extra fee for a merchant. Only provided
    fields are modified. Set confirm=false (default) for a change preview; set confirm=true
    to execute. Requires explicit merchant confirmation.
  params:
  - merchId
  - feeId
  - name
  - target
  - feeType
  - value
  - isTaxable
  - description
  - confirm
  required:
  - merchId
  - feeId
- name: update_store_video
  description: 上傳視頻、添加店鋪視頻。Upload or update the store/shop display video (BannerVideoUrl)
    for a merchant. Supports Base64-encoded video strings or video URLs. Only the
    BannerVideoUrl field is modified; all other store configuration remains unchanged.
    Set confirm=false (default) for a change preview; set confirm=true to execute
    the change. Requires explicit merchant confirmation.
  params:
  - merchId
  - newVideo
  - confirm
  required:
  - merchId
  - newVideo
- name: item_list
  description: 查看所有商品、店裡有哪些商品。Query paginated item/food list for a merchant. Returns
    name, price, stock, sales status, and category IDs.
  params:
  - merchId
  - keyword
  - categoryId
  - menuId
  - salesStatus
  - pageIndex
  - pageSize
  required:
  - merchId
- name: menu_create
  description: 新建菜單、新增一個菜單。Create a new menu for the merchant. Provide Name (required),
    optional CategoryIds, OnlineTimes (days + time slots), and LocalizedNames. Client
    should generate a MenuId GUID. Set confirm=false (default) for a preview; set
    confirm=true to execute. Requires explicit merchant confirmation.
  params:
  - merchId
  - menuId
  - name
  - localizedNames
  - categoryIds
  - onlineTimes
  - isActive
  - sort
  - confirm
  required:
  - merchId
  - name
- name: add_store_user
  description: 新增員工、添加後台帳號。Add a new store user/staff account with a phone number
    and role assignment. Use list_merchant_roles to find available role IDs first.
    Set confirm=false (default) for a preview; set confirm=true to execute.
  params:
  - merchId
  - phone
  - roleId
  - confirm
  required:
  - merchId
  - phone
  - roleId
- name: set_auto_switch_ready_status
  description: 自動切換訂單狀態、關閉自動切換。Enable or disable automatic order status switching
    to ready. Set confirm=false (default) for a preview; set confirm=true to execute.
  params:
  - merchId
  - enabled
  - confirm
  required:
  - merchId
  - enabled
- name: menu_delete
  description: 刪除這個菜單。Delete a menu by ID. This operation is irreversible. Set confirm=false
    (default) for a preview; set confirm=true to execute. Requires explicit merchant
    confirmation.
  params:
  - menuId
  - confirm
  required:
  - menuId
- name: update_store_name
  description: 修改店名、店鋪名稱改為。Update the store/shop name for a merchant. Only the Name
    field is modified; all other store configuration remains unchanged. Set confirm=false
    (default) for a change preview; set confirm=true to execute the change. Requires
    explicit merchant confirmation.
  params:
  - merchId
  - newName
  - confirm
  required:
  - merchId
  - newName
- name: remove_report_subscription
  description: 移除報表郵件訂閱。Remove a business report email subscription by Id or Email.
    When using Email, set IsSalesReport and/or IsPayoutReport to avoid deleting the
    wrong subscription. Set confirm=false (default) for a preview; set confirm=true
    to execute. Requires explicit merchant confirmation.
  params:
  - id
  - email
  - isSalesReport
  - isPayoutReport
  - confirm
  required: []
- name: list_reward_campaigns
  description: 查看優惠券/獎勵活動列表。Query coupon/reward campaigns for a merchant via GET api/MerchCouponPromotion/all.
  params:
  - merchId
  - queryType
  - pageIndex
  - pageSize
  required:
  - merchId
- name: item_update_stock
  description: 修改商品庫存。庫存沒了、補貨。Update item stock quantity. Set confirm=false (default)
    for a preview; set confirm=true to execute.
  params:
  - itemId
  - stock
  - confirm
  required:
  - itemId
- name: get_third_party_integrations
  description: 查看第三方接入狀況、會員系統綁定了嗎。Query third-party integration status (e.g., EasyCrm
    membership system binding). Set confirm=false (default) for a preview; set confirm=true
    to execute.
  params:
  - merchId
  - confirm
  required:
  - merchId
- name: list_my_merchants
  description: '查看我擁有的所有商家店鋪。List all merchants associated with the current account,
    including merchant ID, name, address, logo, phone, email, timezone, and type.
    Important Note: Please call this tool first when you need a MerchId but do not
    have one.You can use this tool to discover available merchants before calling
    any tools that require a MerchId.Set confirm=false (default) for a preview; set
    confirm=true to execute.'
  params:
  - confirm
  required: []
- name: add_delivery_area
  description: '增加配送區域、新增DeliveryArea。Add a new delivery area (DeliveryPolygon) to
    the merchant. Supports two area types: ''circle'' (center point + radius in miles)
    or ''polygon'' (default square centered at the given lat/lng with side length
    2× radius). The new area is appended to existing DeliveryPolygons without affecting
    them. Set confirm=false (default) for a preview; set confirm=true to execute.
    Requires explicit merchant confirmation.'
  params:
  - merchId
  - name
  - areaType
  - latitude
  - longitude
  - deliveryRadiusMiles
  - allowAsap
  - minimumAmountForDelivery
  - minimumAmountToVoidDeliveryFee
  - deliveryFee
  - deliveryFeeTaxable
  - confirm
  required:
  - merchId
  - name
  - areaType
  - latitude
  - longitude
  - deliveryRadiusMiles
  - allowAsap
  - minimumAmountForDelivery
  - deliveryFee
  - deliveryFeeTaxable
- name: batch_item_category
  description: 批量改商品分類。Batch update item category assignments. Set confirm=false (default)
    for a preview; set confirm=true to execute.
  params:
  - categoryIds
  - merchId
  - categoryId
  - merchFoodIds
  - confirm
  required:
  - categoryIds
- name: set_store_open_status
  description: 營業中、暫不營業、切換營業狀態。Set the store/shop business status (open or closed).
    Use "open" to set the store to Opening (business hours), or "closed" to set it
    to Closed (temporarily closed). Only the Status field is modified; all other store
    configuration remains unchanged. Set confirm=false (default) for a change preview;
    set confirm=true to execute the change. Requires explicit merchant confirmation.
  params:
  - merchId
  - status
  - confirm
  required:
  - merchId
  - status
- name: menu_unbind_category
  description: 從菜單移除這個分類。Remove a single category from a menu. The specified CategoryId
    will be removed from the menu's bound categories. Set confirm=false (default)
    for a preview; set confirm=true to execute. Requires explicit merchant confirmation.
  params:
  - menuId
  - categoryId
  - confirm
  required:
  - menuId
  - categoryId
- name: menu_publish
  description: 發布菜單、上線這個菜單、讓顧客看到這個菜單。Publish a menu by setting IsActive=true. Requires
    at least one category to be bound. Set confirm=false (default) for a preview;
    set confirm=true to execute. Requires explicit merchant confirmation.
  params:
  - menuId
  - confirm
  required:
  - menuId
- name: spec_bind_item
  description: 給這個商品加規格、把商品加到規格組。Associate items/foods with a spec group. Set confirm=false
    (default) for a preview; set confirm=true to execute.
  params:
  - merchId
  - specId
  - itemIds
  - optionPrices
  - confirm
  required:
  - merchId
  - specId
  - itemIds
- name: list_merchant_roles
  description: 查看可分配的角色、角色列表。List all available roles for a merchant with their IDs
    and permission counts. Use this to find role IDs before calling add_store_user.
    Supports optional keyword filtering. Set confirm=false (default) for a preview;
    set confirm=true to execute.
  params:
  - merchId
  - keyword
  - confirm
  required:
  - merchId
- name: add_extra_fee
  description: 添加服務費、新增包裝費。Add an extra fee (e.g., service fee, packaging fee) to
    a merchant. The new fee is appended to existing ChargeItems without affecting
    them. Set confirm=false (default) for a preview; set confirm=true to execute.
    Requires explicit merchant confirmation.
  params:
  - merchId
  - name
  - target
  - feeType
  - value
  - isTaxable
  - description
  - confirm
  required:
  - merchId
  - name
  - target
  - feeType
  - value
  - isTaxable
- name: category_list
  description: 查看所有分類、店裡有哪些分類。Query paginated category list for a merchant. Returns
    category name, description, banner URL, and associated menu names.
  params:
  - merchId
  - categoryName
  - menuId
  - pageIndex
  - pageSize
  required:
  - merchId
- name: set_support_realtime_messaging
  description: 開啟即時消息、關閉即時消息。Enable or disable realtime instant messaging (IM) support
    for the store. Set confirm=false (default) for a preview; set confirm=true to
    execute.
  params:
  - merchId
  - enabled
  - confirm
  required:
  - merchId
  - enabled
- name: batch_item_tax
  description: 批量把稅率綁到商品。Batch bind tax rates to items. Set confirm=false (default)
    for a preview; set confirm=true to execute.
  params:
  - taxIds
  - merchId
  - categoryId
  - merchFoodIds
  - confirm
  required:
  - taxIds
- name: item_delete
  description: 刪除這個商品（永久刪除，非下架）。Permanently delete an item/food by ID. For off-sale
    use item_update or batch_item_status. Set confirm=false (default) for a preview;
    set confirm=true to execute.
  params:
  - merchId
  - itemId
  - confirm
  required:
  - merchId
  - itemId
- name: list_delivery_areas
  description: 查看配送區域列表、有哪些配送區。List all delivery areas (DeliveryPolygons) for a merchant.
    Returns complete configuration for each area including daily delivery time slots
    with their indices. Use this as a prerequisite query before update_delivery_area
    (to get AreaId) or update_delivery_time_slot (to get AreaId + Day + SlotIndex).
    Set confirm=false (default) for a preview; set confirm=true to execute.
  params:
  - merchId
  - confirm
  required:
  - merchId
- name: list_store_users
  description: 查看所有員工、用戶列表、後台帳號。List all store users/staff accounts with roles, email,
    phone, and status. Supports keyword search and pagination. Set confirm=false (default)
    for a preview; set confirm=true to execute.
  params:
  - merchId
  - keyword
  - page
  - pageSize
  - confirm
  required:
  - merchId
- name: get_store_link
  description: 獲取店鋪連結、我的店鋪網址。Returns the store/shop public link (StoreLink) and QR
    code link (StoreLinkQrCode). Set confirm=false (default) for a preview; set confirm=true
    to execute.
  params:
  - merchId
  - confirm
  required:
  - merchId
- name: set_delivery_enabled
  description: '開啟配送、關閉外送、提供配送服務。Enable or disable the delivery service for a merchant.
    Modifies the DeliveryType: enabling delivery adds Delivery capability, disabling
    removes it. Pickup capability is preserved when toggling delivery. Set confirm=false
    (default) for a change preview; set confirm=true to execute the change. Requires
    explicit merchant confirmation.'
  params:
  - merchId
  - enabled
  - confirm
  required:
  - merchId
  - enabled
- name: set_tax_rate
  description: 稅率設為10%、修改稅率。Set the tax rate for a merchant. TaxRate is a percentage
    value (e.g., 10 for 10%, 8.875 for 8.875%). Must be between 0 and 100. Only the
    Tax field is modified; all other store configuration remains unchanged. Set confirm=false
    (default) for a change preview; set confirm=true to execute the change. Requires
    explicit merchant confirmation.
  params:
  - merchId
  - taxRate
  - confirm
  required:
  - merchId
  - taxRate
- name: update_store_address
  description: 修改地址、店鋪地址變更為。Update the store/shop address for a merchant. Only the
    Address field is modified; all other store configuration remains unchanged. Set
    confirm=false (default) for a change preview; set confirm=true to execute the
    change. Requires explicit merchant confirmation.
  params:
  - merchId
  - newAddress
  - confirm
  required:
  - merchId
  - newAddress
- name: update_discount_campaign
  description: 修改滿減活動預算、更新新人折扣活動。Update a newbie discount campaign. Fetches existing
    campaign then POST update. Set confirm=false (default) for preview; confirm=true
    to execute.
  params:
  - campaignId
  - name
  - startDate
  - endDate
  - budget
  - isPublished
  - newbieDiscountItems
  - confirm
  required:
  - campaignId
- name: update_store_phone
  description: 更改電話、電話號碼改成。Update the store/shop phone number for a merchant. Only
    the Phone field is modified; all other store configuration remains unchanged.
    Set confirm=false (default) for a change preview; set confirm=true to execute
    the change. Requires explicit merchant confirmation.
  params:
  - merchId
  - newPhone
  - confirm
  required:
  - merchId
  - newPhone
- name: list_report_subscriptions
