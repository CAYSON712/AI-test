  - 工具: update_reward_campaign
    快照工具: list_all_campaigns
    主键参数: campaignId
    主键字段: id
    快照字段:
    - name
    - isPublished
    恢复参数键:
      budget: budget
      name: name
      status: status
    备注: 修改前从 list_reward_campaigns 取原活动配置，跑完写回
  新建后清理:
