    Set confirm=false (default) for a preview; set confirm=true to execute. Requires
    explicit merchant confirmation.
  params:
  - merchId
  - days
  - openTime
  - closeTime
  - preparationMinutes
  - scheduledPickupTimeRange
  - confirm
  required:
  - merchId
  - days
  - openTime
  - closeTime
  - preparationMinutes
- name: set_stripe_invoice_note
  description: 修改Stripe帳單備註、設定備註內容。Set or update the custom Stripe invoice/transaction
    descriptor for a merchant. This field is non-sensitive and can be freely modified.
    Provide TransactionDescriptor (the note text) and IsEnabled (whether to enable
    it). Set confirm=false (default) for a change preview; set confirm=true to execute
    the change. Requires explicit merchant confirmation.
  params:
  - merchId
  - transactionDescriptor
  - isEnabled
  - confirm
  required:
  - merchId
