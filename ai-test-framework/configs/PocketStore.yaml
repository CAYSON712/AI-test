  - 工具: update_store_video
    原因: get_store_info 不返回视频字段
  - 工具: set_auto_print_before_prep
    原因: 无读取该开关当前状态的接口（get_store_info 只返回 merchId/name/logo/phone/email/address），改后无法回读验证
  - 工具: set_takeout_number_mode
    原因: 无读取该开关当前状态的接口（get_store_info 只返回 merchId/name/logo/phone/email/address），改后无法回读验证
  - 工具: set_allow_customer_notes
    原因: 无读取该开关当前状态的接口（get_store_info 只返回 merchId/name/logo/phone/email/address），改后无法回读验证
  - 工具: set_allow_add_items_to_active_order
    原因: 无读取该开关当前状态的接口（get_store_info 只返回 merchId/name/logo/phone/email/address），改后无法回读验证
  - 工具: set_auto_switch_ready_status
    原因: 无读取该开关当前状态的接口（get_store_info 只返回 merchId/name/logo/phone/email/address），改后无法回读验证
  - 工具: set_utensil_default_required
    原因: 无读取该开关当前状态的接口（get_store_info 只返回 merchId/name/logo/phone/email/address），改后无法回读验证
  - 工具: set_push_to_pos
    原因: 无读取该开关当前状态的接口（get_store_info 只返回 merchId/name/logo/phone/email/address），改后无法回读验证
  - 工具: set_allow_customer_cancel_before_prep
    原因: 无读取该开关当前状态的接口（get_store_info 只返回 merchId/name/logo/phone/email/address），改后无法回读验证
  - 工具: set_free_cancel_before_prep_time
    原因: 无读取该开关当前状态的接口（get_store_info 只返回 merchId/name/logo/phone/email/address），改后无法回读验证
  - 工具: set_preorder_lead_days
    原因: 无读取该开关当前状态的接口（get_store_info 只返回 merchId/name/logo/phone/email/address），改后无法回读验证
  - 工具: set_auto_remind_after_pickup_expiry
