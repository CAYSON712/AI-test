连接:
  需求类型: C
  base_url_env: POCKETSTORE_MCP_URL
  token_env: POCKETSTORE_MCP_TOKEN
  merchant_id_env: POCKETSTORE_MCP_MERCHANT_ID
  参数包装: parameters
  干跑开关参数名: confirm
连接演示工具: list_pickup_time_slots
param_enums:
  status:
  - tools:
    - batch_item_status
    values:
    - OnSale
    - OffSale
  - tools:
    - set_store_open_status
    values:
    - open
    - closed
  paymentType:
  - proton_pay
  - offline_cash
  - offline_card
  - offline_other
  priceAdjustmentType:
  - Regular
  - Percentage
  - FixedValue
  discountType:
  - PercentagePrice
  - FixedPrice
  couponType:
  - Cash
  - Percentage
  - ProductExchange
  filterType:
  - All
  - Published
  - Unpublished
  - Deleted
  queryType:
  - All
  - Published
  - UnActive
  - UnPublished
param_bools:
- confirm
- enabled
- isActive
- isEnabled
- isTaxable
- isSalesReport
- isPayoutReport
- isDefaultForNewFood
- allowAsap
- deliveryFeeTaxable
参数约束:
  至少一个:
    batch_item_price:
    - merchFoodIds
    - - merchId
      - categoryId
    batch_item_stock:
    - merchFoodIds
    - - merchId
      - categoryId
    batch_item_status:
    - merchFoodIds
    - - merchId
      - categoryId
  时间先后:
    create_discount_campaign:
      开始: startDate
      结束: endDate
    create_reward_campaign:
      开始: startDate
      结束: endDate
  至少一个为真:
    add_report_subscription:
    - isSalesReport
    - isPayoutReport
参数完整性:
  启用: true
  测试工具前缀:
  - create
  - add
  - update
  关键字段:
  - categoryIds
  - onlineTimes
  - menuIds
  - taxIds
  - roleId
  - feeId
  最大单缺数: 3
