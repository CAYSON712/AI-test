# =====================================================================
# 系统配置：小韩面 RetailPOS 数据查询（AutoMart MCP 纯查询系统）
# =====================================================================
# 用途：给 generic_mcp_executor 提供"连接 + 工具 schema"。
# 能力→工具映射、成功标准从 ability/能力目录_RetailPOS数据查询.yaml 读取。
# 真实 MCP：https://test-auto-mart-mcp.somyeon.com/mcp
#   serverInfo = AutoMart AIM MCP Server 1.0.0
#
# !! 2026-09-17 全量 schema 重拉（对 MCP 端点直连拉取 list_tools）!!
#   - 全端点 17 个工具；本系统写入类工具（batch_insert_products /
#     update_products_by_ids / delete_products_by_ids）已从工具列表移除，
#     本目录为「纯查询 14 工具」（原 11 个 + 新增 3 个）
#   - 新增工具已纳入：query_order_details_by_ids / query_merchant_staffs /
#     query_staff_attendances
#   - 【时间语义修正】优先 relativePeriod（Today/Yesterday/ThisWeek/LastWeek/
#     ThisMonth/LastMonth，服务端按店铺时区解析，不要自行换算）；
#     固定区间用 startAt/endAt 且【不带 Z、不带时区偏移】的店铺本地时间。
#     经营汇总/目录销售汇总忽略时分秒且含结束日期（同日=单日）；
#     订单明细保留时分秒、含起点排终点（查整天填次日 00:00:00）。
#     旧注释「需 ISO8601+08:00」已作废
#   - sortDirection 统一枚举 Ascending/Descending（旧「'0'/'1'」写法已作废）
#   - create_at/update_at 展示优先 xxxAtLocal 并注明 TimeZoneId
#
# 探针事实（2026-09-02，2026-09-17 复核）：
#   - ID 类参数（productId/productIds/orderIds/merchantIds）只接受 string；数字会报服务端错
#   - 公司 测试公司(26377677164869) / 店铺 Test Store(26377732552517)
#   - search_products_by_name 当前环境命中恒为 0（如实返回即可）
#   - query_order_details_by_ids 直接读 AutoMart，不受报表 72 小时时间窗限制
# =====================================================================

# ---- 连接配置（从 .env 读，AUTO_MART_* 前缀区分于旧 POS）----
连接:
  需求类型: "C"                  # C=Agent+MCP 对话式直连
  base_url_env: "AUTO_MART_MCP_URL"
  token_env: "AUTO_MART_MCP_TOKEN"
  company_id_env: "AUTO_MART_COMPANY_ID"      # 请求头 CompanyId = 26377677164869
  merchant_id_env: "AUTO_MART_MERCHANT_ID"    # 默认店铺 = Test Store
  llm_base_url_env: "LLM_API_BASE"            # 复用通用 LLM 决策层
  llm_api_key_env: "LLM_API_KEY"
  llm_model_env: "LLM_MODEL"
  请求头: {Authorization: "Bearer {{token}}", CompanyId: "{{company_id}}"}
  参数包装: "toolParams"          # 服务端升级：所有工具参数必须包在 toolParams 里

# ---- 通用命名（覆盖 executor 业务命名）----
公司ID请求头: "CompanyId"                     # 请求头携带公司ID的字段名
默认上下文参数名: "merchantIds"               # 店铺参数（复数，店铺类工具）
实体ID参数名: "productIds"                    # 商品ID参数（复数）
实体名参数名: "productName"                   # 按名搜索参数
按名搜索工具: [search_products_by_name]       # 「商品名→ID」解析白名单
需ID解析的工具: [query_products_by_ids, query_product_detail_by_id]
连接演示工具: "query_merchants"               # _demo_connect 验证连接用

# ---- MCP 工具 schema（name 必须与能力目录「工具」字段一致；params/required 对齐真实 schema）----
#
# 【参数取值域声明 param_enums / param_bools】（2026-09-22 通用化）
# 目的：让生成器不再硬编码业务知识——新增系统只写本文件，_02 无需改动。
# 机制：生成器按参数名查这两张表做「取值域收敛」，非法值回退首个合法值。
#   param_enums: 参数名 → 合法枚举列表（大小写不敏感）
#   param_bools: 必须传 true/false 的参数名列表
# 说明：同名参数在不同工具语义不同时，用 tools 限定生效工具（见 type）。
#   - 不写 tools → 全局生效
#   - 写 tools    → 仅这些工具生效
param_enums:
  type:
    - tools: [query_datax_menu_product_category_reports]
      values: [Menu, Product, Category]
    - values: [Normal, Preference, RechargeBenefit, PointExchange, MemberBenefit]
  status: [Selling, Off, Active, InActive]
  statuses: [Active, UnActive]
  orderStatus: [Progressing, Completed, Cancelled, BeMerged, Returned, Pending,
                Preparing, Ready, AwaitingCancel, AwaitingRefund]
  orderType: [DineIn, Pickup, ToGo, Delivery, OnlineDineIn, OnlinePickup]
  orderSourceType: [AutoMart, PocketStore, Deliverect, AiPhoneOrder,
                    ScanCodeToOrder, MarketOnlineOrder, Kiosk]
  paymentType: [Cash, CreditCard, DebitCard, Other]
  paymentStatus: [Unpaid, PartiallyPaid, FullyPaid, Captured]
  paymentTerminalType: [Physical, Virtual, None]
  sortField: [Date, Amount, Quantity]
  sortDirection: [Ascending, Descending]
  resultMode: [Count]          # 仅 Count；缺省=Detail，非 Count 一律不传
  relativePeriod: [Today, Yesterday, ThisWeek, LastWeek, ThisMonth, LastMonth]
  saleChannel: [Pos, Delivery, Pickup, ToGo]
param_bools:
  - includeCategory
  - includeSpecificationGroup
  - includeMenu
  - hasMember
  - isEnabled

mcp_tools:
  - name: query_companies
    description: 查询当前账号授权范围内的所有公司，返回公司ID、名称和下属店铺列表；支持按公司名称模糊搜索或指定公司ID列表筛选。
    params: [companyName, companyIds]
    required: []
  - name: query_merchants
    description: 获取当前账号授权范围内的所有店铺列表、TimeZoneId 及每店无人值守状态（isUnattendedModeEnabled）。业务前置步骤：先用它拿店铺ID(MerchantId)，再查菜单/商品/报表。TimeZoneId 缺失时不能推断默认时区。
    params: [merchantName]
    required: []
  - name: query_menus
    description: 查询菜单列表，支持按店铺、状态(UnActive/Active)、销售渠道(Pos/Delivery/Pickup/ToGo)、菜单名称筛选；不指定店铺时返回所有授权店铺的菜单。
    params: [merchantIds, statuses, saleChannel, menuName]
    required: []
  - name: query_categories
    description: 查询分类列表，支持按店铺、分类名称、菜单ID、分类ID筛选；不指定店铺时自动返回所有授权店铺的分类。同时传 menuIds 与 categoryIds 时以 categoryIds 优先。
    params: [merchantIds, categoryName, menuIds, categoryIds]
    required: []
  - name: query_products_by_filter
    description: 按分类ID、商品类型、商品状态等条件组合查询商品列表；所有参数可选，不指定时返回全部商品。结果按商品名称分组。type 枚举 Normal/Preference/RechargeBenefit/PointExchange/MemberBenefit；status 枚举 Off/Selling。
    params: [categoryIds, type, status]
    required: []
  - name: query_products_by_ids
    description: 根据商品ID列表批量查询商品信息，结果按商品名称分组返回；ID 传字符串，如 productIds=["26723267156165"]。
    params: [productIds]
    required: [productIds]
  - name: query_product_detail_by_id
    description: 根据商品ID查询商品详细信息，包括商品基本信息、所属分类、规格组和菜单等关联数据；productId 传字符串。查不存在的 ID 返回 50001。
    params: [productId, includeCategory, includeSpecificationGroup, includeMenu]
    required: [productId]
  - name: search_products_by_name
    description: 按商品名称模糊搜索商品，支持按上架/下架状态筛选；返回商品ID、名称、价格，结果按名称分组。productName 必填且不能为空串。
    params: [merchantIds, productName, status]
    required: [productName]
  - name: query_order_details_by_ids
    description: 按 merchantId + 1~500 个 POS 内部 orderIds 查询完整订单商品明细（成交名称/规格加料/数量/价格/折扣/金额）；直接读 AutoMart，无需日期参数、不受报表 72 小时时间窗限制。返回 Orders(List/TotalElements/TotalPages/IsLast) 与 NotFoundOrderIds（整份输入中当前门店未找到的 ID）。page 默认1、size 默认15(1~50)。
    params: [merchantId, orderIds, page, size]
    required: [merchantId, orderIds]
  - name: query_merchant_staffs
    description: 查询店铺的员工列表，需先调 query_merchants 获取店铺ID。merchantIds 必填（数组）。创建/更新时间优先展示 CreateAtLocal/UpdateAtLocal 并注明 TimeZoneId。
    params: [merchantIds]
    required: [merchantIds]
  - name: query_staff_attendances
    description: 分页查询单店员工考勤，按上班打卡时间筛选。必须提供 merchantId，以及 relativePeriod 或成对 startAt/endAt（互斥，最多366天）；时间为店铺本地时间（无 Z 无偏移），含起点排终点，实际读取截至当前时刻。可选 merchantStaffIds 筛员工；page 默认1、size 默认15(1~100)。展示打卡时间优先用 LocalCheckIn/LocalCheckOut 并注明 TimeZoneId；未下班的 LocalCheckOut 为空，不能推断下班时刻。
    params: [merchantId, merchantStaffIds, relativePeriod, startAt, endAt, page, size]
    required: [merchantId]
  - name: query_datax_total_reports
    description: 查询 DataX 店铺经营汇总报表。必填 merchantId + 时间范围：优先 relativePeriod（Today/Yesterday/ThisWeek/LastWeek/ThisMonth/LastMonth），固定区间用不带时区偏移的店铺本地时间 startAt/endAt（忽略时分秒、含结束日期，同日可查单日）。多来源片在 Segments 返回，不合计金额无全局排名。返回 orderCount/totalSales/netSales/totalGuests/newMembers 等；limit 1~1000(默认100)。
    params: [merchantId, merchantName, relativePeriod, startAt, endAt, limit, sortField, sortDirection]
    required: [merchantId]
  - name: query_datax_order_sales_reports
    description: 查询 DataX 订单销售报表，按订单建立时间筛选（保留时分秒、含起点排终点，查整天填次日00:00:00），时间不带 Z/偏移。支持按 orderId/orderSerial/orderStatus/orderType/paymentType/paymentStatus/orderSourceType/operatorName/sourceName 等筛选，并支持 sortField(Amount/Date)+sortDirection(Ascending/Descending)+limit 取前 N（每片独立排序，多片不代表全局排名）。resultMode=Count 只返回 Summary.OrderCount 去重订单数（忽略 limit 与排序，不支持支付方式/操作员/来源等筛选）；hasMember 筛会员订单。时间范围最多 366 天。
    params: [merchantId, relativePeriod, startAt, endAt, orderId, orderSerial, orderType, orderStatus, orderSourceType, paymentStatus, paymentType, customizedPaymentName, paymentTerminalName, paymentTerminalType, sourceName, operatorName, hasMember, resultMode, sortField, sortDirection, limit]
    required: [merchantId]
  - name: query_datax_menu_product_category_reports
    description: 查询 DataX 菜单商品分类销售汇总报表，可按对象 type（Menu/Product/Category）、名称 name、ID refId 筛选。必填 merchantId + 时间范围（优先 relativePeriod；固定区间用不带偏移的本地时间，忽略时分秒含结束日期）。sortField 支持 Date/Amount/Quantity，sortDirection 枚举 Ascending/Descending；limit 1~1000(默认100)。
    params: [merchantId, refId, name, type, relativePeriod, startAt, endAt, sortField, sortDirection, limit]
    required: [merchantId]

# ---- 需要自动补默认店铺的工具（缺 merchantIds 时填默认店铺 Test Store）----
# 注意：DataX / staff / order_details 工具用单数 merchantId（或必填路径各异），
#       不列入，避免补错字段。
需要默认上下文参数的工具:
  - query_menus
  - query_categories
  - query_products_by_filter
  - search_products_by_name
  - query_merchant_staffs

# ---- 纯查询系统：无写操作，无需 verify/需要校验的工具 ----
