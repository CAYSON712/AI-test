# =====================================================================
# 需求类型 C：Agent + MCP 集成
# =====================================================================
# 来源：《AI 测试方法体系手册》第五章
# C 类 = A 类(8维) + B 类(11维) + 集成专用(4维) = 23 维（名义）
#        按维度名去重合并后 = 20 维（A 与 B 重叠：返回处理/异常与容错/性能与资源）
# 集成专用 4 维严格按手册：
#   1. 工具选择准确率
#   2. 意图→工具映射准确率
#   3. 参数端到端准确率
#   4. 跨工具编排正确性
# 注：全链路评分/生成均按去重后的 20 维，见 evaluate.load_dimension_tables。
# =====================================================================

需求类型: "C"
名称: "Agent + MCP 集成"
描述: "端到端：Agent 决策 + 真实 MCP 工具调用"
适用: "被测对象同时含 Agent 决策层 + 真实 MCP 工具（如 POS 商品管理）"
默认通过率: 0.85
采样次数: 5

# 集成专用维度（C 类特有，额外 4 维）
集成特有维度:
  - 维度: "工具选择准确率"
    类型: "自动断言"
    含义: "Agent 面对多工具时选对工具的比例"
    测试方法: "工具选择矩阵：多种意图 × 多个可用工具，统计正确选择率"
    例子: "'改价格' 应选 update_products_by_ids，而非 delete_products_by_ids"
    rubric:
      "5": "工具选择准确率≥98%"
      "4": "准确率≥95%"
      "3": "准确率≥90%"
      "2": "准确率≥80%"
      "1": "准确率<80%"

  - 维度: "意图到工具映射准确率"
    类型: "自动断言"
    含义: "用户意图正确映射到对应工具，含多意图映射到多工具"
    测试方法: "意图-工具映射校验：单意图单工具/多意图多工具"
    例子: "'先查价格再改价' → 依次映射到 search + update 两个工具"
    rubric:
      "5": "映射准确率≥98%，跨工具意图正确"
      "4": "准确率≥95%"
      "3": "准确率≥90%"
      "2": "准确率≥80%"
      "1": "准确率<80%"

  - 维度: "参数端到端准确率"
    类型: "自动断言"
    含义: "自然语言抽取的参数真实传递到 MCP 并执行正确"
    测试方法: "参数端到端校验：抽取参数→传入 MCP→操作结果核对（操作后实时校验）"
    例子: "改价为 15 → MCP 实时查询返回 price=15"
    rubric:
      "5": "参数端到端准确率≥98%，操作完全生效"
      "4": "准确率≥95%"
      "3": "准确率≥90%"
      "2": "准确率≥80%"
      "1": "准确率<80%"

  - 维度: "跨工具编排正确性"
    类型: "人工审核"
    含义: "多工具按正确顺序编排调用，中间失败能处理"
    测试方法: "跨工具链路测试：验证调用顺序、依赖关系、失败回滚"
    例子: "'先查后改'必须 search→update 顺序，不能反"
    rubric:
      "5": "跨工具编排正确，顺序最优，失败可回滚"
      "4": "编排正确，顺序可优化"
      "3": "主要编排正确，部分场景顺序错"
      "2": "编排错误，工具调用顺序混乱"
      "1": "无法跨工具编排"

# 说明：
# C 类实际测评时 = A 类 8 维 + B 类 11 维 + 本文件集成 4 维 = 23 维
# A 类维度：协议契约 / 工具描述与发现 / 参数校验 / 调用正确性 / 返回处理 / 安全与权限 / 性能与资源 / 异常与容错
# B 类维度：意图识别 / 规划与推理 / 工具调用 / 参数生成 / 上下文与记忆 / 返回处理 / Skill触发与组合 / 非确定性与稳定性 / 鲁棒性与安全 / 性能与资源 / 异常与容错
