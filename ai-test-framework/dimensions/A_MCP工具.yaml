# =====================================================================
# 需求类型 A：MCP 工具
# =====================================================================
# 来源：《AI 测试方法体系手册》第三章，维度严格对齐手册
# =====================================================================

需求类型: "A"
名称: "MCP 工具"
描述: "纯服务侧，偏接口测试 + AI 协议特性"
适用: "被测对象是 MCP Server 暴露的工具/API 本身"
默认通过率: 0.95
采样次数: 5

维度列表:
  - 维度: "协议契约"
    类型: "自动断言"
    含义: "JSON-RPC 2.0 格式合规，方法名/ID 正确，序列化/反序列化正确"
    测试方法: "语法变异法：构造缺失字段、非法 JSON；协议版本矩阵：测试不同 jsonrpc 值"
    例子: "发送缺少 jsonrpc 字段的请求，期望返回 -32600 Invalid Request"
    rubric:
      "5": "协议完全合规，所有合法/非法请求处理正确"
      "4": "协议基本合规，个别边缘格式处理偏差"
      "3": "主要协议正确，部分异常请求处理不当"
      "2": "协议格式错误，异常请求常处理失败"
      "1": "协议严重不合规"

  - 维度: "工具描述与发现"
    类型: "自动断言"
    含义: "tools/list 返回完整，name/description/schema 正确，描述清晰度"
    测试方法: "Schema 静态检查：对比设计文档；描述有效性测试：用 LLM 评估描述质量"
    例子: "调用 tools/list，期望返回 query_store_report 的 description 含'门店报表'关键词"
    rubric:
      "5": "tools/list 完整，schema/描述准确清晰"
      "4": "tools/list 基本完整，个别描述不清晰"
      "3": "主要工具正确，部分描述缺失/模糊"
      "2": "tools/list 不完整，schema 有误"
      "1": "tools/list 失效或大量错误"

  - 维度: "参数校验"
    类型: "自动断言"
    含义: "必填参数缺失、类型错误、边界值、枚举值、特殊字符/注入"
    测试方法: "等价类划分 + 边界值分析；Pairwise 参数组合；模糊测试 Fuzzing"
    例子: "store_id 传空字符串 → 返回参数错误；传 SQL 注入 → 拒绝或转义"
    rubric:
      "5": "参数校验完善，所有非法参数均被拦截并明确报错"
      "4": "多数非法参数被拦截，个别边缘参数未覆盖"
      "3": "必填/类型校验正确，边界/注入校验有遗漏"
      "2": "部分非法参数未拦截，直接执行"
      "1": "参数校验缺失"

  - 维度: "调用正确性"
    类型: "自动断言"
    含义: "参数透传正确、业务逻辑正确、幂等性（重复调用一致）"
    测试方法: "正向场景覆盖所有合法参数组合；业务规则测试；重复执行法同参数跑 5 次"
    例子: "start_date > end_date → 返回日期无效；跨年查询正常返回"
    rubric:
      "5": "所有合法调用正确，幂等性良好"
      "4": "基本正确，个别业务规则边界偏差"
      "3": "主要调用正确，部分场景错误"
      "2": "调用结果常错误"
      "1": "调用完全错误"

  - 维度: "返回处理"
    类型: "自动断言"
    含义: "正常响应解析、业务错误码、HTTP 错误、超时、限流重试、畸形响应、超大响应"
    测试方法: "返回码矩阵法枚举所有状态码；故障注入模拟超时/畸形/超大"
    例子: "后端返回 500 → MCP 返回 -32001；后端返回 10MB → 不 OOM"
    rubric:
      "5": "所有返回场景处理正确，无崩溃"
      "4": "主要返回场景正确，个别畸形响应处理偏差"
      "3": "正常/错误码处理正确，异常返回（超大/畸形）处理不当"
      "2": "返回处理薄弱，异常返回常崩溃"
      "1": "返回处理严重缺陷"

  - 维度: "安全与权限"
    类型: "自动断言"
    含义: "越权查询、敏感信息泄露、输入消毒、审计日志"
    测试方法: "权限矩阵法：不同角色×不同资源；对抗样本注入 payload；日志检查"
    例子: "普通用户查他人门店 → 返回权限错误；错误信息不包含后端路径"
    rubric:
      "5": "权限控制完善，无越权/泄露，有审计日志"
      "4": "权限控制良好，个别越权场景未覆盖"
      "3": "主要权限正确，部分敏感场景未防护"
      "2": "权限控制薄弱，存在越权风险"
      "1": "严重权限漏洞或敏感泄露"

  - 维度: "性能与资源"
    类型: "自动断言"
    含义: "单次调用延迟、并发吞吐、Token 消耗、内存/CPU 峰值"
    测试方法: "负载测试逐步增加并发；Token 审计；资源监控长时间运行"
    例子: "100 并发 → P99 ≤ 500ms；连续 10000 次 → 内存增长 ≤ 5%"
    rubric:
      "5": "性能远超预期，资源无泄漏"
      "4": "性能满足预期，资源稳定"
      "3": "性能接近预期上限，资源有小幅增长"
      "2": "性能超标，存在资源问题"
      "1": "严重性能/资源问题"

  - 维度: "异常与容错"
    类型: "自动断言"
    含义: "后端宕机降级、网络分区超时重试、服务重启不丢请求、配置热加载"
    测试方法: "混沌工程随机杀死服务；重试策略测试；优雅关闭测试"
    例子: "数据库宕机 → 返回友好错误不崩溃；MCP 重启 → 客户端重连正常"
    rubric:
      "5": "容错完善，宕机/网络异常均能优雅降级"
      "4": "容错良好，个别异常场景处理偏差"
      "3": "主要异常能容错，部分场景直接失败"
      "2": "容错薄弱，异常场景常崩溃"
      "1": "无容错能力"
