# =====================================================================
# 需求类型 E：RAG / 知识库
# =====================================================================
# 来源：《AI 测试方法体系手册》第七章，维度严格对齐手册
# =====================================================================

需求类型: "E"
名称: "RAG / 知识库"
描述: "关注检索质量、幻觉、时效性等"
适用: "被测对象含文档/知识库检索环节（非工具调用型）"
默认通过率: 0.85
采样次数: 5

维度列表:
  - 维度: "检索召回率"
    类型: "自动断言"
    含义: "相关文档被检索出的比例，评估检索覆盖率"
    测试方法: "构造问题集，核对 Top-K 检索结果中相关文档占比"
    例子: "问'退货政策' → Top-5 应包含退货政策相关文档"
    rubric:
      "5": "召回率≥95%，相关文档全召回"
      "4": "召回率≥90%，偶发漏召回"
      "3": "召回率≥80%，部分相关文档未召回"
      "2": "召回率≥60%，检索覆盖不足"
      "1": "召回率<60%，严重漏召回"

  - 维度: "检索精准率"
    类型: "自动断言"
    含义: "检索结果中相关文档的比例，衡量检索噪声"
    测试方法: "核对检索结果中无关文档占比"
    例子: "问'营业时间' → Top-5 不应包含大量无关菜单文档"
    rubric:
      "5": "精准率≥95%，无无关结果"
      "4": "精准率≥90%，偶发无关结果"
      "3": "精准率≥80%，部分无关结果"
      "2": "精准率≥60%，噪声较多"
      "1": "精准率<60%，结果混乱"

  - 维度: "幻觉率"
    类型: "LLM打分"
    含义: "回答中凭空捏造、不在文档中的内容比例"
    测试方法: "人工/LLM 核查回答是否都能在检索文档中找到依据"
    例子: "回答'可免费退'但文档无此条款 → 幻觉"
    rubric:
      "5": "幻觉率<2%，几乎无幻觉"
      "4": "幻觉率<5%，偶发幻觉"
      "3": "幻觉率<10%，有一定幻觉"
      "2": "幻觉率<20%，幻觉较多"
      "1": "幻觉率≥20%，严重幻觉"

  - 维度: "知识时效性"
    类型: "自动断言"
    含义: "回答使用最新知识库数据，不使用过时信息"
    测试方法: "更新知识库后测试，核对是否用最新数据"
    例子: "价格改后，问价格应返回新价格而非旧价"
    rubric:
      "5": "完全使用最新文档，无陈旧"
      "4": "基本最新，偶发使用陈旧数据"
      "3": "部分场景使用陈旧文档"
      "2": "常使用过时文档"
      "1": "严重时效性问题"

  - 维度: "答案 Groundedness"
    类型: "LLM打分"
    含义: "答案是否忠于检索到的文档内容，不添加文档外信息"
    测试方法: "逐句核对答案内容都能在检索文档找到依据"
    例子: "答案的每个结论都应能在文档中溯源"
    rubric:
      "5": "答案完全基于检索文档，逐句可溯源"
      "4": "基本忠于文档，个别表述过度"
      "3": "多数忠于，偶发添加文档外内容"
      "2": "常脱离文档作答"
      "1": "答案与文档严重不符"
