# =====================================================================
# 需求类型 D：Skill 原子能力
# =====================================================================
# 来源：《AI 测试方法体系手册》第六章，维度严格对齐手册
# =====================================================================

需求类型: "D"
名称: "Skill 原子能力"
描述: "关注单个 Skill 的触发、执行、边界与组合"
适用: "被测对象是某个原子 Skill（子能力），如'改价'这个能力"
默认通过率: 0.9
采样次数: 5

维度列表:
  - 维度: "触发条件正确性"
    类型: "自动断言"
    含义: "Skill 正确触发，触发条件匹配才执行，不误触发"
    测试方法: "触发条件矩阵：输入×是否该触发；正向/反向用例"
    例子: "说'查菜单' → 触发菜单 Skill；说'改价' → 不触发菜单 Skill"
    rubric:
      "5": "触发条件准确，该触发必触发，不该触发不触发"
      "4": "基本准确，个别边界条件误判"
      "3": "主要条件正确，部分条件遗漏/误触发"
      "2": "触发条件混乱，常误触发"
      "1": "触发条件失效"

  - 维度: "输入输出契约"
    类型: "自动断言"
    含义: "Skill 输入参数定义、输出结构、异常输入处理符合契约"
    测试方法: "契约校验：输入 schema / 输出 schema / 异常输入"
    例子: "改价 Skill 输入 {productIds, price}，输出含成功状态"
    rubric:
      "5": "输入输出契约完全符合，异常输入正确处理"
      "4": "契约基本符合，个别异常输入处理偏差"
      "3": "主要契约正确，部分异常输入未处理"
      "2": "契约不符，输入输出易出错"
      "1": "契约严重不符"

  - 维度: "能力边界"
    类型: "自动断言"
    含义: "Skill 能处理的能力范围明确，超出边界正确处理（拒绝/提示/降级）"
    测试方法: "边界测试：能力范围内/外用例；越界处理验证"
    例子: "改价 Skill 只能改在售商品，下架商品改价应提示不可改"
    rubric:
      "5": "能力边界清晰，越界正确拒绝/提示"
      "4": "边界基本清晰，个别越界场景处理不当"
      "3": "主要边界正确，部分越界未拦截"
      "2": "能力边界模糊，常越权执行"
      "1": "无能力边界，任意执行"

  - 维度: "与其他Skill组合"
    类型: "人工审核"
    含义: "Skill 能被正确组合调用，组合无冲突，优先级正确"
    测试方法: "组合场景测试：多 Skill 协同、优先级、冲突处理"
    例子: "改价 + 上架 组合：先上架再改价，顺序正确"
    rubric:
      "5": "组合调用正确，无冲突，优先级无误"
      "4": "基本正确，个别组合冲突"
      "3": "主要能组合，部分场景冲突"
      "2": "组合调用常出错"
      "1": "无法组合调用"

  - 维度: "错误处理"
    类型: "人工审核"
    含义: "Skill 执行失败时的错误提示、重试、降级"
    测试方法: "故障注入：工具失败/数据异常；错误提示校验"
    例子: "改价失败 → 提示'改价失败请重试'，不崩溃"
    rubric:
      "5": "错误处理完善，失败能重试/降级/友好提示"
      "4": "错误处理良好，个别直接报错"
      "3": "主要错误能处理，部分未覆盖"
      "2": "错误处理薄弱，常中断"
      "1": "无错误处理"

  - 维度: "性能"
    类型: "自动断言"
    含义: "Skill 执行延迟、资源消耗、稳定性"
    测试方法: "性能测试：延迟统计、资源监控、稳定性"
    例子: "改价 Skill 单次 ≤ 2s，连续调用稳定"
    rubric:
      "5": "性能远超预期，稳定"
      "4": "性能满足预期"
      "3": "性能接近预期上限"
      "2": "性能超标，不稳定"
      "1": "严重性能问题"
