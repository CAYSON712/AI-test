# 被测系统：AI POS Mobile App 的「餐厅菜单管理助手」
# 真实 MCP：https://pos-test-mcp.proton-system.com/mcp
# 工具：query_menus / update_products_by_ids / query_categories /
#       query_companies / batch_insert_products / query_merchants /
#       delete_products_by_ids / query_products_by_filter /
#       search_products_by_name / query_product_detail_by_id / query_products_by_ids
# 引用：数据集里的「能力」字段取自本目录
# =====================================================================

系统: "POS 商品管理"
描述: "餐厅菜单管理助手：通过自然语言完成菜单管理操作（商品上下架、价格修改、新增、删除、查询）"
版本: "1.0"

能力分组:
  - 分组: "商品上下架"
    说明: "商品上架 / 下架状态管理"
    能力列表:
      - 能力: "商品上架"
        参数: [productIds, status]
        工具: update_products_by_ids
        layer: "E2E"
        verify_tool: query_products_by_ids
        verify_field: status
        说明: "把指定商品改为上架(Selling)状态"
      - 能力: "商品下架"
        参数: [productIds, status]
        工具: update_products_by_ids
        layer: "E2E"
        verify_tool: query_products_by_ids
        verify_field: status
        说明: "把指定商品改为下架(Off)状态"
      - 能力: "批量上下架"
        参数: [productIds, status]
        工具: update_products_by_ids
        layer: "Skill"
        verify_tool: query_products_by_ids
        verify_field: status
        说明: "一次批量设置多个商品上下架状态"

  - 分组: "价格修改"
    说明: "修改商品价格"
    能力列表:
      - 能力: "修改价格"
        参数: [productIds, price]
        工具: update_products_by_ids
        layer: "E2E"
        verify_tool: query_products_by_ids
        verify_field: price
        说明: "修改一个或多个商品的价格"
      - 能力: "批量改价"
        参数: [productIds, prices]
        工具: update_products_by_ids
        layer: "Skill"
        verify_tool: query_products_by_ids
        verify_field: price
        说明: "批量修改多个商品价格"

  - 分组: "名称修改"
    说明: "修改商品中/英文名称"
    能力列表:
      - 能力: "修改商品名称"
        参数: [productIds, name]
        工具: update_products_by_ids
        layer: "E2E"
        verify_tool: query_products_by_ids
        verify_field: name
        说明: "修改一个或多个商品的中文名称"
      - 能力: "修改商品英文名称"
        参数: [productIds, name_en]
        工具: update_products_by_ids
        layer: "E2E"
        verify_tool: query_products_by_ids
        verify_field: nameEn
        说明: "修改一个或多个商品的英文名称"
      - 能力: "批量修改名称"
        参数: [productIds, names]
        工具: update_products_by_ids
        layer: "Skill"
        verify_tool: query_products_by_ids
        verify_field: name
        说明: "批量修改多个商品的名称"

  - 分组: "商品新增"
    说明: "新增商品到店铺"
    能力列表:
      - 能力: "新增商品"
        参数: [merchantId, name, price, categoryId]
        工具: batch_insert_products
        layer: "E2E"
        verify_tool: query_products_by_filter
        verify_field: exists
        说明: "在指定店铺新增单个商品"
      - 能力: "批量新增商品"
        参数: [merchantId, products]
        工具: batch_insert_products
        layer: "Skill"
        verify_tool: query_products_by_filter
        verify_field: exists
        说明: "在指定店铺批量新增商品（最多200个）"

  - 分组: "商品删除"
    说明: "删除商品（不可恢复）"
    能力列表:
      - 能力: "删除商品"
        参数: [productIds]
        工具: delete_products_by_ids
        layer: "E2E"
        verify_tool: query_products_by_ids
        verify_field: exists
        verify_expect: false
        说明: "按ID删除商品，不可恢复"
      - 能力: "批量删除商品"
        参数: [productIds]
        工具: delete_products_by_ids
        layer: "Skill"
        verify_tool: query_products_by_ids
        verify_field: exists
        verify_expect: false
        说明: "批量删除多个商品，不可恢复"

  - 分组: "商品查询"
    说明: "查询商品/菜单/分类信息"
    能力列表:
      - 能力: "查询商品"
        参数: [productName]
        工具: search_products_by_name
        说明: "按名称搜索商品"
      - 能力: "按ID查询商品"
        参数: [productIds]
        工具: query_products_by_ids
        说明: "按ID批量查询商品"
      - 能力: "按条件筛选商品"
        参数: [categoryId, status]
        工具: query_products_by_filter
        说明: "按分类/状态等条件筛选商品"
      - 能力: "查询商品详情"
        参数: [productId]
        工具: query_product_detail_by_id
        说明: "按ID查询商品详细信息"
      - 能力: "查询菜单"
        参数: [merchantId, status, saleChannel]
        工具: query_menus
        说明: "查询菜单列表"
      - 能力: "查询分类"
        参数: [merchantId, name]
        工具: query_categories
        说明: "查询分类列表"

  - 分组: "前置基础"
    说明: "查询公司/店铺（其他操作的前置步骤）"
    能力列表:
      - 能力: "查询公司"
        参数: [companyId]
        工具: query_companies
        说明: "查询当前账号授权公司列表"
      - 能力: "查询店铺"
        参数: []
        工具: query_merchants
        说明: "查询授权店铺列表"

  - 分组: "边界与异常"
    说明: "无数据、失败、安全等边界场景"
    能力列表:
      - 能力: "删除不存在商品"
        参数: [productIds]
        工具: delete_products_by_ids
        说明: "删除不存在的商品，验证失败处理"
      - 能力: "越权操作"
        参数: [merchantId]
        工具: update_products_by_ids
        说明: "操作无权店铺商品，验证越权防护"
      - 能力: "指令注入"
        参数: []
        工具: update_products_by_ids
        说明: "注入攻击，验证安全防护"
      - 能力: "组合操作"
        参数: []
        工具: query_products_by_ids
        说明: "多意图混合场景（如先查再改）"
      - 能力: "查询"
        参数: []
        工具: query_products_by_filter
        说明: "通用查询兜底"
