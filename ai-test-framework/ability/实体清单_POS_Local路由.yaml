# =====================================================================
# 实体清单：POS Local 店铺服务器路由（AI POS 1.2）
# =====================================================================
# 需求：A-1 店铺服务器路由 / A-2 Local 报表查询转发 / A-3 Local 能力与版本管控
#
# ★ 本清单的核心：每条店铺自带 companyId ★
#   同一 TOKEN 可见多间公司，但 CompanyId 请求头决定能操作哪间公司。
#   Local 店与 Cloud 店分属不同公司，只换 merchantId 不换 CompanyId 会稳定
#   报 40100 "The requested merchant is not authorized for the current company."，
#   请求到不了路由层，会被误判成「Local 路由失效」。
#   生成器据此把 companyId 注入用例的「运行时上下文」，执行器按实体换请求头。
#
# 数据来源：2026-11-04 实调公鸡 MCP 拉取（query_companies / query_merchants /
#   query_datax_* / query_menus / query_categories / query_merchant_staffs）
# 时区：America/Los_Angeles（PDT=UTC-7 / PST=UTC-8）
#
# ⚠ 店铺可用性（用户 2026-11-04 确认）：
#   - 11897214392730629 ZH_Rooster_Local  = 唯一确认「已升级 MCP 版本」的 Local 店 ★可用
#   - 8563036762604549 chongqing hot      = Cloud 对照组 ★可用
#   - 其余 3 家 serverMode=Local 的店铺（Torch Rooster local66 / Liam Dev / dio-local）
#     均为开发或他人环境，未确认版本状态，**不纳入本清单**，避免误用。
#
# ⚠ 待补（拿不到就宁缺毋假）：
#   - Local 且「未升级 MCP 版本」的店铺 → A-3 版本校验用例暂时只能靠占位/人工
# =====================================================================

