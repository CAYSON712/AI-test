# =====================================================================
# 能力目录：小韩面 Retail POS 数据查询
# =====================================================================
# 被测系统：Retail POS MCP（数据查询封装层）+ AIM MCP 对接
# 数据来源：DATAX 中的小韩面业务数据（AIM 不直接读取 DATAX）
# 工具：query_order_id / query_order_status / query_order_count /
#       query_order_payable_amount / query_order_points_deduction /
#       query_order_actual_amount / query_product_id / query_product_name /
#       query_product_category / query_product_sales_quantity /
#       query_product_sales_amount / query_payment_method /
#       query_payment_amount / query_payment_status / query_refund_type /
#       query_refund_amount / query_returned_product / query_returned_quantity /
#       query_member_id / query_member_consumption / query_points_usage /
#       query_points_deduction / query_member_registered_at / query_new_member_count
#
# ★ 本系统为「纯查询」系统（无变更/删除/创建）：
#   - 生成器在纯查询下自动走「查询变体」场景（易混淆查询工具对、
#     日期/门店参数抽取、多查询工具编排、越权查询等），见
#     scripts/generate_dataset.py 的 C 类维度生成器。
#
# ★ 通用查询条件（入参 schema 待开发发测后对齐，当前为业务语义假设）：
#   - dateType: 业务日期(businessDate) / 订单时间(orderTime) /
#               支付时间(payTime) / 退款时间(refundTime)
#   - date:     今日 / 昨日 / 指定日期(YYYY-MM-DD) / 日期范围(YYYY-MM-DD~YYYY-MM-DD)
#   - 组织维度:  companyId / merchantId / storeId（按业务主体筛选）
#   - 对象维度:  orderId / productId / productName / memberId
#   - 时间基准: 用户设备本地时区
#   - 空结果:   MCP 返回空结果，AIM 回复「暂无数据」，不编造业务数据
# =====================================================================

系统: "小韩面 Retail POS 数据查询"
描述: "Retail POS MCP：基于 DATAX 小韩面业务数据，为 AIM 提供销售/订单/商品/支付/退款/会员数据的统一结构化查询能力，支持按查询条件筛选/汇总/排序/排行"
版本: "1.0"

能力分组:
  - 分组: "订单查询"
    说明: "订单 ID / 状态 / 数量 / 金额类查询"
    能力列表:
      - 能力: "查询订单ID"
        操作类型: "查询"
        layer: "L1"
        参数: [dateType, date, storeId]
        工具: query_order_id
        成功标准:
          - 模式: 语义
            期望: "返回符合条件的订单ID列表，含订单ID/订单状态"
        负向场景:
          - 输入: "查询无权限门店的订单ID"
            成功标准:
              - 模式: 拒绝
      - 能力: "查询订单状态"
        操作类型: "查询"
        layer: "L1"
        参数: [orderId]
        工具: query_order_status
        成功标准:
          - 模式: 语义
            期望: "返回指定订单的订单状态，含订单ID/订单状态"
      - 能力: "查询订单数量"
        操作类型: "查询"
        layer: "L1"
        参数: [dateType, date, storeId]
        工具: query_order_count
        成功标准:
          - 模式: 语义
            期望: "返回符合条件的订单数量，含订单数量"
      - 能力: "查询订单应付金额"
        操作类型: "查询"
        layer: "L1"
        参数: [dateType, date, storeId]
        工具: query_order_payable_amount
        成功标准:
          - 模式: 语义
            期望: "返回订单应付金额，含应付金额"
      - 能力: "查询积分抵扣金额"
        操作类型: "查询"
        layer: "L1"
        参数: [dateType, date, storeId]
        工具: query_order_points_deduction
        成功标准:
          - 模式: 语义
            期望: "返回订单积分抵扣金额，含积分抵扣金额"
      - 能力: "查询订单实付金额"
        操作类型: "查询"
        layer: "L1"
        参数: [dateType, date, storeId]
        工具: query_order_actual_amount
        成功标准:
          - 模式: 语义
            期望: "返回订单实付金额，含订单实付金额"

