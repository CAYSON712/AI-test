  # ---------------------------------------------------------------
  # Cloud 对照组 ★★★ 本数据集最关键的分组 ★★★
  # ---------------------------------------------------------------
  # 为什么必须有 Cloud 组：A-2 要求「Local 查询语义与既有 Cloud 一致」，
  # A-3 要求「Local 写操作一律禁用」。只有把「同一个工具 + 同一组参数」
  # 在 Cloud 店上跑一遍，才能证明：
  #   ① A-2：Local 返回结构与 Cloud 一致（不是 Local 单独造了个格式）
  #   ② A-3：Local 被拒是「因为它是 Local」，而不是「这个工具本来就不能用」
  # 没有 Cloud 组，A-3 的全部拒绝用例都可能被「工具本身坏了」解释掉，
  # 断言就失去区分度。
  #
  # 注意：Cloud 店 chongqing hot 的 query_datax_total_reports 当前稳定报
  #   50001（todayLocalAt 字段缺陷），故 Cloud 侧只放订单报表作一致性基线。
  - 分组: "Cloud对照"
    说明: "同一工具同一参数在 Cloud 店铺上的行为基线，用于证明 Local 的差异源自路由而非工具本身"
    能力列表:
      - 能力: "查询Cloud店铺订单明细"
        操作类型: "查询"
        layer: "L1"
        # 与 Local 侧参数保持一致 —— A-2 要求「Local 查询语义与 Cloud 一致」，
        # 两边参数集不同就无法逐项对照（同一过滤条件必须两边都能跑）。
        参数: [merchantId, relativePeriod, orderType, orderStatus, paymentStatus,
               paymentType, sourceName, orderSourceType, paymentTerminalName,
               sortField, sortDirection, limit]
        工具: query_datax_order_sales_reports
        筛选实体: {serverMode: "Cloud"}
        口语问法:
          - "chongqing hot 今天的订单明细"
          - "云端店今天有哪些单"
          - "云端店只看堂食的订单"
        成功标准:
          - 模式: 语义
            期望: "返回订单销售明细，字段结构须与 Local 店铺完全一致"

      - 能力: "查询Cloud店铺目录报表"
        操作类型: "查询"
        layer: "L1"
        参数: [merchantId, relativePeriod, type, refId, name, sortField,
               sortDirection, limit]
        工具: query_datax_menu_product_category_reports
        筛选实体: {serverMode: "Cloud"}
        口语问法:
          - "chongqing hot 今天哪个商品卖得最好"
        成功标准:
          - 模式: 语义
            期望: "返回菜单/商品/分类报表记录，字段结构须与 Local 店铺完全一致"

      # ★ 2026-11-06 补：Cloud 侧经营汇总对照。
      #   此前刻意跳过（理由"Cloud total 报表当前 50001 不可用"），但跳过意味着
      #   A-2「Local 与 Cloud 查询语义一致」在经营汇总这一项完全没被验证。
      #   正确做法是测出来并记录缺陷，而不是回避。
      #   预期：Cloud 店该工具稳定 50001（todayLocalAt 字段缺陷），
      #   故这些用例会稳定失败——它们本身就是缺陷的证明。
      - 能力: "查询Cloud店铺经营汇总"
        操作类型: "查询"
        layer: "L1"
        参数: [merchantId, relativePeriod, startAt, endAt, sortField,
               sortDirection, limit]
        工具: query_datax_total_reports
        筛选实体: {serverMode: "Cloud"}
        口语问法:
          - "chongqing hot 今天的销售额多少"
          - "云端店上周经营汇总"
        成功标准:
          - 模式: 语义
            期望: "返回经营汇总，字段结构须与 Local 店铺完全一致"

      - 能力: "查询Cloud店铺路由模式"
        操作类型: "查询"
        layer: "L1"
        参数: []
        工具: query_merchants
        筛选实体: {serverMode: "Cloud"}
        口语问法:
          - "chongqing hot 是本地还是云端的"
        成功标准:
          - 模式: 语义
            期望: "返回该店铺且 serverMode=Cloud，与 Local 店形成路由对照"

  # ---------------------------------------------------------------
  # 只读查询面（对照：这些非报表类查询不属 A-2 转发范围，但可用于断言路由）
  # ---------------------------------------------------------------
  - 分组: "Local只读查询"
    说明: "菜单/分类/员工/商品等只读查询，用于交叉验证 Local 店铺读取通道，并作为写入安全边界的同域快照工具"
    能力列表:
      # 商品域只读工具（A-3 的改/删/增商品写能力也需要「同域」探针与快照）。
      #
      # ⚠ 更正（2026-11-06 实测推翻 11-05 的错误结论）：
      #   此前判定 query_products_by_filter / query_products_by_ids「Local 不可用」，
      #   根因是**参数名传错了**，不是工具不可用：
      #     · query_products_by_ids   要 merchantIds（复数列表），传 merchantId 报 40100
      #     · query_products_by_filter 同样要 merchantIds（复数列表）
      #     · query_product_detail_by_id 要 merchantId（单数），不传报 40000「店铺 ID 不能为空」
      #   按正确的参数名调用后，三者在 Local 店全部 code=0 正常返回。
      #   教训：报 40100/40000 时先核对参数名与类型（单数/复数、标量/列表），
      #   不要直接下「该工具在 Local 不可用」的结论。
      #
      # 实测可用枚举（Local 店，2026-11-06）：
      #   status : Selling / Off（SoldOut、Draft、Deleted、Hidden、Active 均协议层异常）
      #   type   : Normal（Product、Modifier、Combo、Package、Menu 均协议层异常）
      #   categoryIds : 真实分类 ID（如 11897285288002565）可用
      - 能力: "查询Local店铺商品"
        操作类型: "查询"
        layer: "L1"
        参数: [merchantIds, productName]
        工具: search_products_by_name
        筛选实体: {serverMode: "Local"}
        口语问法:
          - "ZH_Rooster_Local 有哪些商品"
          - "搜一下本地店的饺子类商品"
        成功标准:
          - 模式: 语义
            期望: "返回商品列表，含 id、name、price、status"

      # ★ 2026-11-06 新增：按 ID 查商品详情（Local 可用，传 merchantId 单数）
      - 能力: "查询Local店铺商品详情"
        操作类型: "查询"
        layer: "L1"
        # includeCategory/includeMenu/includeSpecificationGroup 为布尔选填
        # （2026-11-09 按实时 schema 补全，此前 configs 漏声明导致零覆盖）
        参数: [merchantId, productId, includeCategory, includeMenu,
               includeSpecificationGroup]
        工具: query_product_detail_by_id
        筛选实体: {serverMode: "Local"}
        口语问法:
          - "ZH_Rooster_Local 这个商品多少钱"
          - "看一下本地店这个商品的详情和分类"
        成功标准:
          - 模式: 语义
            期望: "返回商品详情（product）与所属分类（categories），含 id、name、price、stock、status"

      # ★ 2026-11-06 新增：按 ID 批量查商品（Local 可用，传 merchantIds 列表）
      - 能力: "按ID批量查询Local店铺商品"
        操作类型: "查询"
        layer: "L2"
