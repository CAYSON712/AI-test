        工具: query_products_by_filter
        筛选实体: {serverMode: "Local"}
        口语问法:
          - "ZH_Rooster_Local 有哪些在售商品"
          - "本地店下架的商品有哪些"
          - "本地店这个分类下有哪些商品"
        成功标准:
          - 模式: 语义
            期望: "返回符合条件的商品列表，含 id、name、price、status"

      - 能力: "查询Local店铺菜单"
        操作类型: "查询"
        layer: "L2"
        参数: [merchantIds]
        工具: query_menus
        筛选实体: {serverMode: "Local"}
        口语问法:
          - "ZH_Rooster_Local 有哪些菜单"
        成功标准:
          - 模式: 语义
            期望: "返回菜单列表，含 id、name、status，且含 serverMode=Local"

      - 能力: "查询Local店铺分类"
        操作类型: "查询"
        layer: "L2"
        参数: [merchantIds]
        工具: query_categories
        筛选实体: {serverMode: "Local"}
