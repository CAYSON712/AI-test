        成功标准:
          - 模式: 语义
            期望: "返回商品列表，含 id、name、price、status；不存在的 ID 如实省略或返回空"

      # ★ 2026-11-06 新增：按条件筛选商品（Local 可用，传 merchantIds 列表）
      - 能力: "按条件筛选Local店铺商品"
        操作类型: "查询"
        layer: "L2"
