# =====================================================================
# 能力目录：POS 数据报表（POS(proton) DataX 三报表 MCP）
# =====================================================================
# 被测系统：AI POS Mobile — POS 数据查询 Skill
# 真实 MCP：https://pos-test-mcp.proton-system.com/mcp
# 公司：cayson自动化公司(12599656434959365)；店铺：自动化店铺7(12600071176193029)
# 时区：洛杉矶(PDT=UTC-7)
#
# 数据事实（探针 2026-09-09/10）：
#   - 9/9: orderCount=15 totalSales=989.76 netSales=1068.49 actualRevenue=2507.08 线上=110.77
#   - 服务端按来源分多段(segments)，SEGMENTS_MUST_NOT_BE_SUMMED
#   - limit 上限 1000（每个 segment 各自应用）
#   - netSales 口径 = preTaxRevenue + totalTaxAmount（非"销售减折扣"）
#   - actualRevenue 含充值与礼品卡，与纯销售额 totalSales 口径不同
#
# 【新版接口变更 2026-09-10 实测】
#   - 时间参数不带 Z/时区偏移（用店铺本地时间）：startAt/endAt 如 '2026-09-09'
#   - endAt 语义因工具而异：
#       * 汇总(total) / 目录(menu)：包含结束日期（同日可查单日）
#       * 订单(order_sales)：不包含 endAt（同日会报 range must be positive，须 endAt=次日）
#   - 新增 relativePeriod（枚举 Today/Yesterday/ThisWeek/LastWeek/ThisMonth/LastMonth），
#     服务端按店铺时区解析、周一为首日；使用它时省略 startAt/endAt，且与 startAt/endAt 互斥
#   - required 仅 merchantId（时间参数可选，但需 relativePeriod 或 startAt+endAt 二选一）
#   - 返回新增 timeZoneId(店铺时区) 与 requestedDateRange
# =====================================================================

系统: "POS 数据报表"
描述: "AI POS Mobile 的 POS 数据查询 Skill：用自然语言查询经营汇总/订单明细/菜单商品分类报表（只读）"
版本: "1.0"

能力分组:
  # ---------------------------------------------------------------
  # 1. 经营汇总查询
  # ---------------------------------------------------------------
  - 分组: "经营汇总查询"
    说明: "DataX 店铺经营汇总报表（FlatTotalReport）"
    能力列表:
      - 能力: "查询店铺经营汇总"
        操作类型: "查询"
        layer: "L1"
        参数: [merchantId, startAt, endAt]
        工具: query_datax_total_reports
        口语问法:
          - "看一下 2026/09/09 的销售额"
          - "9月9号有多少单"
          - "昨天客流多少？"
        成功标准:
          - 模式: 语义
            期望: "返回指定时间窗的经营汇总，字段含 orderCount、totalSales、totalGuests、actualRevenue 等，数值来自报表不得编造"
        负向场景:
          - 输入: "查询非授权店铺（店铺 ID 不属于当前账号）的经营汇总"
            工具参数:
              merchantId: "99999999999999"
              startAt: "2026-09-09T00:00:00-07:00"
              endAt: "2026-09-10T00:00:00-07:00"
            成功标准:
              - 模式: 拒绝

  # ---------------------------------------------------------------
  # 2. 订单销售明细查询
  # ---------------------------------------------------------------
  - 分组: "订单销售明细查询"
    说明: "DataX 订单销售报表（FlatOrderSalesReport）"
    能力列表:
      - 能力: "查询订单销售明细"
        操作类型: "查询"
        layer: "L1"
        参数: [merchantId, startAt, endAt]
        工具: query_datax_order_sales_reports
        口语问法:
          - "查一下自动化店铺7 的订单明细"
          - "帮我查订单 13551217880797189 的详情"
        成功标准:
          - 模式: 语义
            期望: "返回订单销售明细，含 orderId/orderSerial/orderType/orderStatus/paymentType/totalAmount 等；查不到时如实告知"
        负向场景:
          - 输入: "查询非授权店铺的订单销售明细"
            工具参数:
              merchantId: "99999999999999"
              startAt: "2026-09-09T00:00:00-07:00"
              endAt: "2026-09-10T00:00:00-07:00"
            成功标准:
              - 模式: 拒绝

  # ---------------------------------------------------------------
  # 3. 菜单商品分类报表查询
  # ---------------------------------------------------------------
  - 分组: "菜单商品分类报表查询"
    说明: "DataX 菜单商品分类报表（FlatMenuProductCategoryReport）"
    能力列表:
      - 能力: "查询菜单商品分类报表"
        操作类型: "查询"
        layer: "L1"
        参数: [merchantId, startAt, endAt, type]
        工具: query_datax_menu_product_category_reports
        口语问法:
          - "这个月销量前10是哪些"
          - "Curry Fish Fillet 这个月卖了多少份"
        成功标准:
          - 模式: 语义
            期望: "返回菜单/商品/分类报表记录，含 name、type、amount、quantity；无数据时如实告知"
        负向场景:
          - 输入: "查询非授权店铺的菜单商品分类报表"
            工具参数:
              merchantId: "99999999999999"
              startAt: "2026-09-01T00:00:00-07:00"
              endAt: "2026-09-10T00:00:00-07:00"
            成功标准:
              - 模式: 拒绝

  # ---------------------------------------------------------------
  # 4. 基础目录查询
  # ---------------------------------------------------------------
  - 分组: "基础目录查询"
    说明: "公司与店铺目录"
    能力列表:
      - 能力: "查询公司列表"
        操作类型: "查询"
        layer: "L1"
        参数: []
        工具: query_companies
        口语问法:
          - "当前账号能访问哪些公司"
        成功标准:
          - 模式: 语义
            期望: "返回授权公司列表，至少包含 cayson自动化公司"
      - 能力: "查询店铺列表"
        操作类型: "查询"
        layer: "L1"
        参数: []
        工具: query_merchants
        口语问法:
          - "公司名下有哪几家店"
        成功标准:
          - 模式: 语义
            期望: "返回店铺列表，至少包含 自动化店铺7"

  # ---------------------------------------------------------------
  # 5. 订单商品明细（下钻）
  # ---------------------------------------------------------------
  - 分组: "订单商品明细查询"
    说明: "按 orderId 查完整商品明细，支撑折扣/加收下钻"
    能力列表:
      - 能力: "查询订单商品明细"
        操作类型: "查询"
        layer: "L2"
        参数: [merchantId, orderIds]
        工具: query_order_details_by_ids
        口语问法:
          - "9月9号那笔 143.19 的单买了什么"
        成功标准:
          - 模式: 语义
            期望: "返回订单商品明细，含品名/数量/单价/折扣/加收/金额"

  # ---------------------------------------------------------------
  # 6. 工具元数据（能力发现 / 描述检查）
  # ---------------------------------------------------------------
  - 分组: "工具元数据"
    说明: "MCP 协议层的工具发现与描述检查（tools/list）"
    能力列表:
      - 能力: "列出可用工具"
        操作类型: "查询"
        layer: "L1"
        参数: []
        工具: "*"
        类型: "meta"
        口语问法:
          - "当前 MCP 提供哪些工具"
        成功标准:
          - 模式: 语义
            期望: "返回全部工具，至少含 query_datax_total_reports / query_datax_order_sales_reports / query_datax_menu_product_category_reports 三个 DataX 报表工具，且 schema 完整"
      - 能力: "工具描述"
        操作类型: "查询"
        layer: "L1"
        参数: []
        工具: "*"
        类型: "meta"
        口语问法:
          - "这个工具是干什么的"
        成功标准:
          - 模式: 语义
            期望: "工具描述可读且能说明用途（如经营汇总/订单销售/菜单商品分类），描述含关键字段名或功能关键词"

        操作类型: "查询"
        layer: "L2"
        参数: [merchantId, orderIds]
        工具: query_order_details_by_ids
        口语问法:
          - "9月9号那笔 143.19 的单买了什么"
        成功标准:
          - 模式: 语义
            期望: "返回订单商品明细，含品名/数量/单价/折扣/加收/金额"
