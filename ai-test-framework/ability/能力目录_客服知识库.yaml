# =====================================================================
# 能力目录：客服知识库（RAG / 知识库，需求类型 E）
# =====================================================================
# 被测系统：电商平台客服知识库（政策咨询 / 售后处理 / 服务信息）
# 接入方式：需求类型 E → generic_rag_executor（检索 + 生成），见 registry.py
#
# ★ 问答对（E 类数据源）★
#   - build_e 从「问答对」节点生成 RAG 测试用例（问题 / 期望文档 / 答案）
#   - generic_rag_executor 的 Mock 检索也据此动态生成文档（不写死业务词）
#   - 支持能力项级 / 分组级 / 顶层「问答对」；能力项级优先
# =====================================================================

系统: "客服知识库"
描述: "电商平台客服知识库：退货退款政策、营业时间、物流配送等常见问题解答"
版本: "1.0"

能力分组:
  - 分组: "售后政策"
    说明: "退货 / 退款 / 退换货政策"
    能力列表:
      - 能力: "退货政策"
        操作类型: "查询"
        layer: "L1"
        参数: []
        工具: search
        成功标准:
          - 模式: 语义
            期望: "返回退货政策说明"
        问答对:
          - 能力: "退货政策"
            问题: "退货政策是什么？"
            期望文档: "RET-01"
            答案: "支持7天无理由退货，需保留原包装"
      - 能力: "退款时效"
        操作类型: "查询"
        layer: "L1"
        参数: []
        工具: search
        成功标准:
          - 模式: 语义
            期望: "返回退款时效说明"
        问答对:
          - 能力: "退款时效"
            问题: "退款需要多长时间？"
            期望文档: "RET-02"
            答案: "退款将在3-5个工作日内原路退回"
      - 能力: "退换货流程"
        操作类型: "查询"
        layer: "L2"
        参数: []
        工具: search
        成功标准:
