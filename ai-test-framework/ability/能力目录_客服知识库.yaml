            期望文档: "RET-03"
            答案: "联系客服提交退换货申请，审核通过后寄回商品"

  - 分组: "服务信息"
    说明: "营业时间 / 物流配送"
    能力列表:
      - 能力: "营业时间"
        操作类型: "查询"
        layer: "L1"
        参数: []
        工具: search
        成功标准:
          - 模式: 语义
            期望: "返回营业时间说明"
        问答对:
          - 能力: "营业时间"
            问题: "你们的营业时间是什么时候？"
            期望文档: "HOUR-01"
            答案: "营业时间 10:00-22:00，节假日照常"
      - 能力: "物流配送"
        操作类型: "查询"
        layer: "L1"
        参数: []
        工具: search
        成功标准:
          - 模式: 语义
