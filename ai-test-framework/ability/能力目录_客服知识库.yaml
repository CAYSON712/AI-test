        问答对:
          - 能力: "物流配送"
            问题: "一般多久能收到货？"
            期望文档: "LOG-01"
            答案: "默认快递配送，预计3-5天送达"
      - 能力: "物流查询"
        操作类型: "查询"
        layer: "L2"
        参数: []
        工具: search
        成功标准:
