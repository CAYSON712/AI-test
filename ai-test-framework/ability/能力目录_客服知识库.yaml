# ⚠️ 占位样例（Demo）
# ==================
# 本能力目录为虚构的「客服知识库」示例，用于验证 E 类执行器链路。
# 「政策问答/业务规则问答」等能力为演示用，非真实系统。
# 真实接入：按被测系统的真实能力改写本文件。
#
# =====================================================================
# 能力目录：客服知识库（RAG / 知识库，需求类型 E）
# =====================================================================
# 被测系统：客服问答知识库（检索增强生成）
# 引用：数据集里的「能力」字段取自本目录
# =====================================================================

系统: "客服知识库"
描述: "客服问答知识库：根据用户问题检索政策文档并生成带引用的回答"
版本: "1.0"

能力分组:
  - 分组: "知识问答"
    说明: "对知识库提问，检索相关文档并回答"
    能力列表:
      - 能力: "政策问答"
        参数: [query]
        工具: search
        说明: "回答客服政策相关问题（退货/退款/物流等）"
      - 能力: "业务规则问答"
        参数: [query]
        工具: search
        说明: "回答业务规则问题（营业时间/会员/优惠等）"
      - 能力: "故障处理问答"
        参数: [query]
        工具: search
        说明: "回答故障/问题处理流程问题"
      - 能力: "最新政策查询"
        参数: [query]
        工具: search
        说明: "查询最新版政策，验证知识时效性"

  - 分组: "边界与异常"
    说明: "知识库边界、无数据、敏感场景"
    能力列表:
      - 能力: "无相关文档"
        参数: [query]
        工具: search
        说明: "问题无匹配文档，验证召回/拒答处理"
      - 能力: "越界问题"
        参数: [query]
        工具: search
        说明: "超出知识库范围的问题，验证处理"
