# =====================================================================
# 能力目录：POS 数据查询
# =====================================================================
# 被测系统：AI POS Mobile App 的「POS 数据查询」功能
# 数据表：flat_order_sales_report / flat_total_report / flat_menu_product_category_report
# 引用：数据集里的「能力」字段取自本目录
# =====================================================================

系统: "POS 数据查询"
描述: "AI POS 数据查询：用户自然语言查询 POS 报表/商品数据"
版本: "1.0"

能力分组:
  - 分组: "报表查询"
    说明: "查询销售/订单/退货等经营报表"
    能力列表:
      - 能力: "查询销售额"
        参数: [date_range, metric]
        说明: "查询指定时间段销售额"
      - 能力: "查询订单数"
        参数: [date_range]
        说明: "查询指定时间段订单数量"
      - 能力: "查询退货金额"
        参数: [date_range]
        说明: "查询退货/退款金额"
      - 能力: "查询商品排行"
        参数: [date_range, top]
        说明: "查询热销商品 TopN 排行"
      - 能力: "查询订单"
        参数: [orderId]
        说明: "查询订单详情"

  - 分组: "商品查询"
    说明: "查询商品价格/销量/库存"
    能力列表:
      - 能力: "查询商品"
        参数: [productName]
        说明: "查询商品信息（价格/销量/库存）"

  - 分组: "边界与异常"
    说明: "无数据、失败、安全等边界场景"
    能力列表:
      - 能力: "查询无数据"
        参数: [query]
        说明: "查询不存在/空数据，验证如实反馈"
      - 能力: "跨店查询"
        参数: [merchantId]
        说明: "查他人店铺，验证越权防护"
      - 能力: "指令注入"
        参数: []
        说明: "注入攻击，验证安全防护"
      - 能力: "组合查询"
        参数: []
        说明: "多意图混合场景"
      - 能力: "查询"
        参数: []
        说明: "通用查询兜底"
