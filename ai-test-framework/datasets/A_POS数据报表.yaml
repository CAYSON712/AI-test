系统: POS 数据报表
需求类型: A
被测系统: POS(proton) MCP — https://pos-test-mcp.proton-system.com/mcp
CompanyId: '12599656434959365'  # cayson自动化公司
merchantId: '12600071176193029' # 自动化店铺7 (Auto test store7, 洛杉矶时区)
分层说明:
  L1: 黄金集(60%) 手工精选，覆盖 3 个 DataX 报表工具 × 28 业务场景，每场景 L1 主用例
  L2: 场景演化(30%) 每场景配套 L2 变体(实体替换/时间窗变异/排序边界/维度下钻/异常容错)
  L3: 生产回放(10%) 待接入
数据口径:
  时区: 店铺为洛杉矶时区，夏令时 PDT=UTC-7，冬令时 PST=UTC-8
  归属日: '报表 date 按门店本地自然日切分(带 05:00:00+00:00 标记 = PDT 00:00)'
  分段: '服务端按来源分多段(segments)返回，SEGMENTS_MUST_NOT_BE_SUMMED(各段不能直接相加)'
  工具入参: '统一为 {toolParams: {...}}'
真值快照(2026-09-09 实测):
  9/8: orderCount=21(明细) sources={EasyPos:19,ScanCodeToOrder:1,Yesmeal:1} status={Completed:20,Cancelled:1}
  9/9: orderCount=13 totalSales=868.26 netSales=954.84 preTaxRevenue=878.92 actualRevenue=2384.11
       dueAmount=2613.40 unpaidAmount=106.32 refundAmount=-32.00 totalTipsAmount=44.91
       totalDiscountAmount=-135.82 totalSurchargeAmount=158.48 totalTaxAmount=88.07
       totalGuests=16 cancelledOrders=3 cancelledOrderAmount=195.40
       totalPayCashAmount=394.10 totalPayCreditCardAmount=1783.94 totalPayOtherAmount=79.51
       totalPayMemberBalanceAmount=138.76 totalPayOnlineOrderAmount=110.77
       online=Yesmeal 20.90+31.35, Deliverect 29.59+60.28
  备注: 9/9 为进行中数据(RECENT_WINDOW_IN_PROGRESS)，数值会随时间变化；断言以字段存在/口径关系为主
用例数: 119
用例列表:
# =====================================================================
