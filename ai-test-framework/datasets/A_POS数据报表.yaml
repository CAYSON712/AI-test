# ---------- 场景01: 查询指定日期销售额 ----------
- 维度: 调用正确性
  能力: 查询店铺经营汇总
  层: L1
  输入:
    tool_name: query_datax_total_reports
    tool_params: &S1
      merchantId: '12600071176193029'
      startAt: '2026-09-09'
      endAt: '2026-09-09'
  期望:
    intent: 查询店铺经营汇总
    params: *S1
    output: 返回 2026/09/09 销售额，需给出 totalSales(商品销售总额)，不得编造
    block: false
    semantic:
      fields: [totalSales, netSales, actualRevenue]
  标签: [正常, 场景01, 销售额]
  用例ID: A-L1-001
- 维度: 调用正确性
  能力: 查询店铺经营汇总
  层: L2
  输入:
    tool_name: query_datax_total_reports
    tool_params: &S1b
      merchantId: '12600071176193029'
      startAt: '2026-09-08'
      endAt: '2026-09-08'
  期望:
    intent: 查询店铺经营汇总
    params: *S1b
    output: 返回 2026/09/08 销售额，日期是前一日，数值与 9/9 不同
    block: false
    semantic:
      fields: [totalSales, actualRevenue]
      not_contains: ["编造"]
  标签: [变体, 场景01, 时间变异]
  用例ID: A-L2-001

