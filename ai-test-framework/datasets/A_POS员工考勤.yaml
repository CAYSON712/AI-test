系统: POS员工考勤
需求类型: A
被测系统: POS(proton) MCP — https://pos-test-mcp.proton-system.com/mcp
CompanyId: '12599656434959365'  # cayson自动化公司
merchantId: '12600071176193029' # 自动化店铺7 (Auto test store7, 洛杉矶时区)
分层说明:
  L1: 黄金集(60%) 手工精选，覆盖员工列表/考勤记录/目录查询，含字段与结构断言
  L2: 场景演化(30%) 参数校验/边界/权限/异常容错
  L3: 生产回放(10%) 待接入
数据口径:
  时区: '店铺为洛杉矶时区，夏令时 PDT=UTC-7'
  时间参数: 'startTime/endTime 支持 YYYY-MM-DD 或 ISO8601；不支持空格分隔（YYYY-MM-DD HH:MM:SS 会报错）'
  数组参数: 'merchantIds / merchantStaffIds 必须为数组，传字符串报错'
  分页: 'page 默认1；size 默认15，范围 1~100（越界返回 40000）'
  工具入参: '统一为 {toolParams: {...}}'
真值快照(2026-09-10 实测):
  员工列表: 5 人（Boss Boss/1111 q/2222 c/3333/4444），仅 Boss isOwner=true
  attendanceStatus 枚举: NotCheckIn/OnDuty/StartRest/EndRest/OffDuty
  考勤记录: 8月考勤仅 1 条（2222 c, 08/03 10:19~23:23 PDT, 14.3h）
  字段: checkIn/checkOut/duration/workTotalTime/breakTotalTime/overWorkTotalTime
  注意: 员工与考勤为实时数据，断言以字段存在性/关系约束为主，避免硬编码数值
用例数: 37
用例列表:
# =====================================================================
# 一、L1 员工列表与实时状态
# =====================================================================
- 维度: 调用正确性
  能力: 查询店铺员工列表
  层: L1
  输入:
    tool_name: query_merchant_staffs
    tool_params: &E1
      merchantIds: ['12600071176193029']
  期望:
    intent: 查询店铺员工列表
    params: *E1
    output: 返回员工列表，含 id/firstName/lastName/isOwner/attendanceStatus 字段
    block: false
    semantic:
      fields: [id, firstName, lastName, isOwner, attendanceStatus]
  标签: [正常, 员工列表]
  用例ID: AT-L1-001
- 维度: 调用正确性
  能力: 查询店铺员工列表
  层: L1
