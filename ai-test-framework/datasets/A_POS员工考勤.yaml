    tool_name: query_merchant_staffs
    tool_params: &E2
      merchantIds: ['12600071176193029']
  期望:
    intent: 查询店铺员工列表
    params: *E2
    output: 返回员工列表，至少包含店主 Boss（isOwner=true）
    block: false
