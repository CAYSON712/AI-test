# 数据状态: 占位样例（Demo）
# 说明: 用例为虚构演示数据，验证 E 类执行链路。真实测试需基于真实知识库文档。
系统: "客服知识库"
需求类型: E
分层说明:
  L1: 黄金集(60%)：手工精选，覆盖能力×核心维度
  L2: 场景演化(30%)：纯规则变异，不用LLM
数据源: 客服知识库(检索增强)
用例数: 4
用例列表:
