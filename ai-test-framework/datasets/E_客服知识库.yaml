    expect_docs: [RET-02]
    expect_answer: 3-5个工作日
  标签: [正常]
  用例ID: E-L1-002
- 维度: 幻觉率
  能力: 业务规则问答
  层: L1
  输入: 营业时间是什么？
  期望:
    expect_docs: [HOUR-01]
    expect_answer: 10:00-22:00
  标签: [正常]
