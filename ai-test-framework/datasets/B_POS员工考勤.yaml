系统: POS员工考勤
需求类型: B
被测系统: POS(proton) MCP — https://pos-test-mcp.proton-system.com/mcp
CompanyId: '12599656434959365'  # cayson自动化公司
merchantId: '12600071176193029' # 自动化店铺7 (Auto test store7, 洛杉矶时区)
分层说明:
  L1: 黄金集(60%)：自然语言 → 意图识别 + 参数生成 + 工具选择
  L2: 场景演化(30%)：时间口语、聚合计算、能力边界、越权诱导
  L3: 生产回放(10%)：待接入
数据口径:
  时区: '店铺为洛杉矶时区（PDT=UTC-7）'
  数组参数: 'merchantIds / merchantStaffIds 必须为数组'
  期望: 'B 类断言 = 意图 + 参数 + 语义'
真值快照(2026-09-10 实测):
  员工: 5 人（Boss Boss/1111 q/2222 c/3333/4444），仅 Boss isOwner=true
  attendanceStatus: NotCheckIn/OnDuty/StartRest/EndRest/OffDuty
  考勤: 8月仅 1 条（2222 c）；9月多条
  能力缺口: 无时薪/工资、无班次/排班、无权限字段
用例数: 28
