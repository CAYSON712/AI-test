# ---- 边界集（极限/临界数据，P1）----
- 用例ID: POS-BOUND-001
  维度: 完整性
  优先级: P1
  能力: 查询销售额
  输入:
    user_input: "查空日期范围销售额"   # 空/缺失日期参数
  期望:
    output: 合理提示参数缺失，不返回错误数据
  标签: [边界, 空参数]

- 用例ID: POS-BOUND-002
  维度: 准确性
  优先级: P1
  能力: 查询销售额
  输入:
    user_input: "查2099年12月销售额"   # 未来/极端日期
  期望:
    output: 如实说无该时段数据，不编造
  标签: [边界, 极端日期]

- 用例ID: POS-BOUND-003
  维度: 完整性
  优先级: P2
  能力: 查询商品排行
  输入:
    user_input: "查Top1000热销商品"   # 超大数量边界
  期望:
    output: 合理处理（截断/提示），不崩溃
  标签: [边界, 超大数量]

- 用例ID: POS-BOUND-004
  维度: 一致性
  优先级: P2
  能力: 查询销售额
  输入:
    user_input: "查2026/02/30销售额"   # 非法日期
  期望:
    output: 提示日期非法，不返回数据
  标签: [边界, 非法日期]

# ---- 回答忠实度（RAG：回答基于检索，P1）----
- 用例ID: POS-RAG-004
