# =====================================================================
# AI POS 数据查询 测试数据集（维度驱动）
# =====================================================================
# 被测需求：AI POS Mobile App 的「POS 数据查询」功能
# 数据表: flat_order_sales_report / flat_total_report / flat_menu_product_category_report
# 设计依据：数据集设计规范.md（5大类维度 + P级 + 统一Schema）
# 【能力字段规范】能力 使用统一标准业务能力（查询销售额/查询商品等），
#    细化场景（日期范围/TopN/模糊）放 标签 或 期望参数，便于执行器路由。
# =====================================================================

# ---------------------------------------------------------------------
# ① 核心质量（编号 1）
# ---------------------------------------------------------------------

# ---- 准确性（有标准答案，P0）----
- 用例ID: POS-ACC-001
  维度: 准确性
  优先级: P0
  能力: 查询销售额
  输入:
    user_input: "查看2026/08/01销售额"
    variants: ["8月1号卖了多少", "查2026/08/01的营业额"]
  期望:
    params: {date_range: [2026-08-01, 2026-08-01], metric: sales}
    output: "销售额为15860元"
  标签: [正向, 单条件, 标准数据]

- 用例ID: POS-ACC-002
  维度: 准确性
  优先级: P0
  能力: 查询订单数
  输入:
    user_input: "2026/08/01有多少笔订单"
  期望:
    output: "320笔订单"
  标签: [正向, 数量]

- 用例ID: POS-ACC-003
  维度: 准确性
  优先级: P1
  能力: 查询退货金额
  输入:
    user_input: "本月退货金额"
    variants: ["这个月退了多少货", "本月退款总额"]
  期望:
    params: {date_range: [本月], metric: refund}
    output: "本月退货金额为320元"
  标签: [正向, 相对日期]

# ---- 相关性（对不对题，P1）----
- 用例ID: POS-REL-001
  维度: 相关性
  优先级: P1
  能力: 查询商品
  输入:
    user_input: "可乐卖得怎么样"
  期望:
    output: 回答可乐销量，不答别的商品
  标签: [正向, 紧扣主题]

- 用例ID: POS-REL-002
  维度: 相关性
  优先级: P1
  能力: 查询商品
  输入:
    user_input: "查可乐的价格"
  期望:
    output: 只答价格，不答库存/销量
  标签: [正向, 紧扣主题]

# ---- 忠实度（无数据/边界，P1）----
- 用例ID: POS-FAITH-001
  维度: 忠实度
  优先级: P1
  能力: 查询无数据
  输入:
    user_input: "查2025年1月销售额"
  期望:
    output: "未找到该时间段销售数据"
  标签: [负向, 无数据, 如实反馈]

- 用例ID: POS-FAITH-002
  维度: 忠实度
  优先级: P1
  能力: 查询无数据
  输入:
    user_input: "查不存在店铺的销售额"
  期望:
    output: 如实说无此店铺，不编造数据
  标签: [负向, 无店铺]

# ---- 完整性（该答的都答，P1）----
- 用例ID: POS-COMP-001
  维度: 完整性
  优先级: P1
  能力: 查询销售额
  输入:
    user_input: "查2026/08/01销售额和订单数"
  期望:
    output: 两项都答（销售额+订单数）
  标签: [多子项]

- 用例ID: POS-COMP-002
  维度: 完整性
  优先级: P2
  能力: 查询商品
  输入:
    user_input: "查可乐的价格和库存"
  期望:
    output: 价格+库存都答
  标签: [多子项]

# ---- 一致性（重复执行稳定，P2）----
- 用例ID: POS-CONS-001
  维度: 一致性
  优先级: P2
  能力: 查询销售额
  输入:
    user_input: "查2026/08/01销售额"
  执行次数: 5
  期望:
    output: 5次结果一致
  标签: [稳定性]

# ---------------------------------------------------------------------
# ② Agent 决策（编号 2）
# ---------------------------------------------------------------------

# ---- 意图识别（多说法，P0）----
- 用例ID: POS-INT-001
  维度: 意图识别
  优先级: P0
  能力: 查询销售额
  输入:
    user_input: "查看2026/08/01销售额"
    variants: ["8月1号卖了多少", "查昨天的营业额"]
  期望:
    intent: 查询销售
  标签: [正向, 多说法]

- 用例ID: POS-INT-002
  维度: 意图识别
  优先级: P0
  能力: 查询
  输入:
    user_input: "帮我把可乐下架"
  期望:
    intent: 商品下架
  标签: [正向, 能力区分]

- 用例ID: POS-INT-003
  维度: 意图识别
  优先级: P1
  能力: 查询销售额
  输入:
    user_input: "看一下销售情况"
  期望:
    intent: 合理反问或给出多种解读
  标签: [模糊, 边界]

# ---- 工具选择（选对3张表，P1）----
- 用例ID: POS-TOOL-001
  维度: 工具选择
  优先级: P1
  能力: 查询订单
  输入:
    user_input: "查订单ORD10086的详情"
  期望:
    tool: flat_order_sales_report
  标签: [正向, 选对表]

- 用例ID: POS-TOOL-002
  维度: 工具选择
  优先级: P1
  能力: 查询商品排行
  输入:
    user_input: "8月热销商品Top10"
  期望:
    tool: flat_menu_product_category_report
  标签: [正向, 选对表]

# ---- 参数抽取（P0）----
- 用例ID: POS-PARAM-001
  维度: 参数抽取
  优先级: P0
  能力: 查询销售额
  输入:
    user_input: "查2026/08/01到08/07销售额"
  期望:
    params: {date_range: [2026-08-01, 2026-08-07], metric: sales}
  标签: [正向, 日期范围]

- 用例ID: POS-PARAM-002
  维度: 参数抽取
  优先级: P0
  能力: 查询退货金额
  输入:
    user_input: "本月退货金额"
  期望:
    params: {date_range: [本月], metric: refund}
  标签: [正向, 相对日期]

- 用例ID: POS-PARAM-003
  维度: 参数抽取
  优先级: P1
  能力: 查询销售额
  输入:
    user_input: "查Test01店8月销售额"
  期望:
    params: {merchantId: Test01, date_range: [8月], metric: sales}
  标签: [多条件, 多店铺]

- 用例ID: POS-PARAM-004
  维度: 参数抽取
  优先级: P1
  能力: 查询销售额
  输入:
    user_input: "按支付方式统计销售额"
  期望:
    params: {dimension: payment_method, metric: sales}
  标签: [维度分析]

- 用例ID: POS-PARAM-005
  维度: 参数抽取
  优先级: P1
  能力: 查询商品排行
  输入:
    user_input: "上个月Top10热销商品"
  期望:
    params: {date_range: [上个月], sort: sales, top: 10}
  标签: [TopN]

# ---- 工具调用成功率（P1）----
- 用例ID: POS-TOOLOK-001
  维度: 工具调用成功率
  优先级: P1
  能力: 查询销售额
